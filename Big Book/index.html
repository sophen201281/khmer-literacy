<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ខ្ញុំអាចមើលឃើញ · 3D Flip Book</title>
    <!-- Google Font: Khmer Battambang -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- Reset & Global Book Styling --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #c9b6a2;
            font-family: 'Battambang', 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            touch-action: pan-y;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        /* --- Home Button --- */
        .home-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(40, 55, 65, 0.9);
            backdrop-filter: blur(8px);
            color: #f0ebe0;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: clamp(0.9rem, 1.8vw, 1.1rem);
            font-weight: 500;
            border: 1.5px solid #b8a690;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            z-index: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .home-btn:hover { background: rgba(60, 80, 95, 0.95); transform: scale(1.04); border-color: #d4c4b0; }
        .home-btn:active { transform: scale(0.94); }

        /* --- Mode Selector --- */
        .mode-select-wrap {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 400;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(40, 55, 65, 0.92);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1.5px solid #b8a690;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .mode-select-wrap label {
            color: #d4c4b0;
            font-size: clamp(0.75rem, 1.6vw, 0.95rem);
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            white-space: nowrap;
        }
        .mode-select-wrap select {
            background: rgba(255, 255, 255, 0.08);
            color: #f5e9da;
            border: 1.5px solid #8ba0b0;
            border-radius: 30px;
            padding: 6px 18px 6px 16px;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #d4c4b0 50%),
                              linear-gradient(135deg, #d4c4b0 50%, transparent 50%);
            background-position: calc(100% - 16px) center, calc(100% - 11px) center;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            padding-right: 34px;
        }
        .mode-select-wrap select:focus { border-color: #d4c4b0; }
        .mode-select-wrap select option { background: #2b4a5c; color: #f5e9da; }

        /* --- Flipbook Container --- */
        .flipbook-wrapper {
            perspective: 2000px;
            width: 100%;
            max-width: 820px;
            height: 52vh;
            max-height: 52vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 0 auto;
            padding: 6px 0;
            flex-shrink: 0;
        }

        .flipbook {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            max-width: 820px;
            max-height: 52vh;
            aspect-ratio: 3 / 4;
            min-height: 0;
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- Pages --- */
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: #fcf8f0;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(0.4rem, 2vh, 1.5rem) clamp(0.4rem, 1.5vw, 1.5rem);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #e3d7c8;
            pointer-events: none;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), filter 0.3s ease;
            will-change: transform;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 245, 235, 0.25) 0%, transparent 70%);
        }

        .page-left {
            left: 0;
            border-radius: 8px 0 0 8px;
            border-right: 1px solid #d0c0ac;
            transform-origin: right center;
            background: #faf5eb;
        }

        .page-right {
            left: 50%;
            border-radius: 0 8px 8px 0;
            border-left: 1px solid #d0c0ac;
            transform-origin: left center;
            background: #fcf8f0;
        }

        /* --- Cover & Back Cover (full width, centered) --- */
        .cover {
            background: #2b4a5c;
            color: #f5e9da;
            border: 2px solid #1d3442;
            width: 100% !important;
            height: 100% !important;
            left: 0 !important;
            border-radius: 8px !important;
            border-right: 2px solid #1d3442 !important;
        }
        .cover h1 {
            font-size: clamp(1.6rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #14222b;
            margin-bottom: 0.2rem;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            line-height: 1.2;
            padding: 0 0.3rem;
        }
        .cover .sub {
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
            opacity: 0.7;
            border-top: 1px solid #8ba0b0;
            padding-top: 0.3rem;
            width: 70%;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }

        .back-cover {
            background: #2b4a5c;
            color: #f5e9da;
            border: 2px solid #1d3442;
            width: 100% !important;
            height: 100% !important;
            left: 0 !important;
            border-radius: 8px !important;
            border-left: 2px solid #1d3442 !important;
        }
        .back-cover .sub {
            opacity: 0.5;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            margin-top: 0.3rem;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }

        .page-title {
            font-size: clamp(1.6rem, 4vw, 3rem);
            font-weight: 700;
            color: #1f3a47;
            margin-bottom: 0.2rem;
            line-height: 1.2;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            padding: 0 0.3rem;
        }

        /* --- Interactive Elements --- */
        .sentence-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px;
            width: 100%;
            padding: clamp(4px, 1vh, 10px);
            position: relative;
        }

        .word-box {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: #1f2e3a;
            font-weight: 400;
            padding: clamp(2px, 0.5vh, 6px) clamp(4px, 1.2vw, 12px);
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }

        .interactive-box {
            display: inline-flex;
            position: relative;
            pointer-events: auto;
            z-index: 20;
            padding: clamp(4px, 1vh, 12px) clamp(8px, 1.5vw, 20px);
            background: #f0e6da;
            border-radius: clamp(6px, 1vw, 12px);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.06);
            min-width: clamp(60px, 12vw, 120px);
            min-height: clamp(30px, 5vh, 60px);
            align-items: center;
            border: 2px solid #cfc2b2;
            overflow: visible;
        }

        .interactive-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: clamp(28px, 4vh, 50px);
        }

        .hidden-word {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 500;
            color: #1f3a47;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
            opacity: 0.3;
            transition: opacity 0.4s ease;
            padding: clamp(2px, 0.4vh, 6px) clamp(4px, 0.8vw, 12px);
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }
        .hidden-word.revealed { opacity: 1; }

        .word-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #faf5eb;
            border: 3px solid #d4c4b0;
            border-radius: clamp(4px, 0.6vw, 8px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.4rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: #b84a4a;
            cursor: grab;
            touch-action: none;
            z-index: 5;
            transition: box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            padding: clamp(2px, 0.6vh, 8px) clamp(4px, 1.2vw, 14px);
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }
        .word-cover:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); border-color: #bfae99; }
        .word-cover:active { cursor: grabbing; }
        .word-cover.dragging {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: #fcfbf7;
            border-color: #a8907a;
            z-index: 10;
            cursor: grabbing;
        }

        .emoji-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 20;
            padding: clamp(8px, 2vh, 20px);
            min-width: clamp(60px, 15vw, 120px);
            min-height: clamp(60px, 15vw, 120px);
        }

        .hidden-emoji {
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 1.2;
            filter: drop-shadow(2px 6px 14px rgba(0, 0, 0, 0.15));
            margin: 0.1rem 0;
            opacity: 0.3;
            transition: opacity 0.4s ease;
            display: block;
            width: 100%;
            text-align: center;
        }
        .hidden-emoji.revealed { opacity: 1; }

        .emoji-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #faf5eb;
            border: 4px solid #d4c4b0;
            border-radius: clamp(8px, 1.5vw, 16px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #b84a4a;
            cursor: grab;
            touch-action: none;
            z-index: 5;
            transition: box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            padding: clamp(2px, 0.6vh, 8px) clamp(4px, 1.2vw, 14px);
            letter-spacing: 0.3px;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        .emoji-cover span {
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1;
            display: block;
            text-align: center;
            width: 100%;
        }
        .emoji-cover:hover { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); border-color: #bfae99; }
        .emoji-cover:active { cursor: grabbing; }
        .emoji-cover.dragging {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: #fcfbf7;
            border-color: #a8907a;
            z-index: 10;
            cursor: grabbing;
        }

        .empty-page {
            background: #f4ede3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b8aa98;
            font-style: italic;
            letter-spacing: 2px;
            font-size: clamp(0.7rem, 1.5vw, 1.2rem);
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }

        /* --- Touch Zones --- */
        .touch-zones-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        .touch-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            pointer-events: auto;
            cursor: pointer;
        }
        .touch-left { left: 0; }
        .touch-right { right: 0; }

        .page-indicator {
            position: fixed;
            top: 12px;
            right: 16px;
            background: rgba(40, 55, 65, 0.85);
            backdrop-filter: blur(10px);
            color: #f0ebe0;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1.5px solid #b8a690;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            z-index: 300;
            pointer-events: none;
            font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
        }

        /* --- Book Shadow & Spine --- */
        .flipbook-wrapper::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 5%;
            width: 90%;
            height: 14px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(8px);
            z-index: -1;
        }
        .flipbook::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.15) 100%);
            z-index: 200;
            pointer-events: none;
            transform: translateX(-50%);
        }
        .flipbook.cover-only::before { display: none; }
        .flipbook.back-only::before { display: none; }

        /* --- Single-page centering for cover/back --- */
        .flipbook.cover-only { transform: none; }
        .flipbook.back-only { transform: none; }
        .flipbook.cover-only .touch-zones-container { transform: none; }
        .flipbook.back-only .touch-zones-container { transform: none; }

        /* --- Flip Animations --- */
        @keyframes flipLeaveForward {
            0%   { transform: rotateY(0deg) scaleX(1); filter: brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02)); }
            50%  { transform: rotateY(-92deg) scaleX(0.93); filter: brightness(0.75) drop-shadow(-14px 0 22px rgba(0,0,0,0.28)); }
            100% { transform: rotateY(-180deg) scaleX(1); filter: brightness(0.92) drop-shadow(-2px 0 6px rgba(0,0,0,0.06)); }
        }
        @keyframes flipEnterForward {
            0%   { transform: rotateY(180deg) scaleX(1); filter: brightness(0.96) drop-shadow(2px 0 8px rgba(0,0,0,0.04)); }
            50%  { transform: rotateY(88deg) scaleX(0.93); filter: brightness(0.75) drop-shadow(14px 0 22px rgba(0,0,0,0.28)); }
            100% { transform: rotateY(0deg) scaleX(1); filter: brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02)); }
        }
        @keyframes flipLeaveBackward {
            0%   { transform: rotateY(0deg) scaleX(1); filter: brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02)); }
            50%  { transform: rotateY(88deg) scaleX(0.93); filter: brightness(0.75) drop-shadow(14px 0 22px rgba(0,0,0,0.28)); }
            100% { transform: rotateY(180deg) scaleX(1); filter: brightness(0.96) drop-shadow(2px 0 8px rgba(0,0,0,0.04)); }
        }
        @keyframes flipEnterBackward {
            0%   { transform: rotateY(-180deg) scaleX(1); filter: brightness(0.92) drop-shadow(-2px 0 6px rgba(0,0,0,0.06)); }
            50%  { transform: rotateY(-92deg) scaleX(0.93); filter: brightness(0.75) drop-shadow(-14px 0 22px rgba(0,0,0,0.28)); }
            100% { transform: rotateY(0deg) scaleX(1); filter: brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02)); }
        }

        /* --- Responsive --- */
        @media (max-height: 700px) { .flipbook-wrapper { height: 46vh; max-height: 46vh; } .flipbook { max-height: 46vh; } }
        @media (max-height: 600px) { .flipbook-wrapper { height: 42vh; max-height: 42vh; } .flipbook { max-height: 42vh; aspect-ratio: 4/3; } }
        @media (max-height: 500px) { .flipbook-wrapper { height: 38vh; max-height: 38vh; } .flipbook { max-height: 38vh; aspect-ratio: 4/3; } }
        @media (max-width: 420px) { body { padding: 4px; } .flipbook-wrapper { padding: 4px 0; } }

        @media (min-width: 600px) and (max-width: 1023px) {
            .flipbook-wrapper { max-width: 900px; height: 62vh; max-height: 62vh; perspective: 2400px; }
            .flipbook { max-width: 900px; max-height: 62vh; }
        }

        @media (min-width: 1024px) {
            .flipbook-wrapper { max-width: 1000px; height: 80vh; max-height: 80vh; perspective: 3000px; }
            .flipbook { max-width: 1000px; max-height: 80vh; }
            .home-btn, .page-indicator { font-size: 1.05rem; }
        }

        @media (min-width: 1024px) and (max-height: 750px) {
            .flipbook-wrapper { height: 72vh; max-height: 72vh; }
            .flipbook { max-height: 72vh; }
        }

        @media (orientation: landscape) {
            .flipbook-wrapper { height: 76vh; max-height: 76vh; }
            .flipbook { aspect-ratio: 4/3; max-height: 76vh; }
            .hidden-word { font-size: clamp(2rem, 4vw, 3.5rem) !important; }
            .word-cover { font-size: clamp(2.2rem, 4.5vw, 4rem) !important; }
            .hidden-emoji { font-size: clamp(4rem, 12vw, 8rem) !important; }
            .emoji-cover span { font-size: clamp(3rem, 8vw, 5.5rem) !important; }
            .word-box { font-size: clamp(1.4rem, 3vw, 2.4rem) !important; }
            .page-title { font-size: clamp(2rem, 4.5vw, 3.5rem) !important; }
            .cover h1 { font-size: clamp(2rem, 4.5vw, 3.5rem) !important; }
            .interactive-box { min-height: 45px !important; min-width: 85px !important; padding: 6px 14px !important; }
            .emoji-container { min-width: 85px !important; min-height: 85px !important; padding: 8px !important; }
            .mode-select-wrap { bottom: 20px; }
        }

        @media (orientation: landscape) and (min-width: 1024px) {
            .flipbook-wrapper { height: 86vh; max-height: 86vh; max-width: 1100px; }
            .flipbook { max-height: 86vh; max-width: 1100px; }
        }

        @media (orientation: landscape) and (max-height: 450px) {
            .flipbook-wrapper { height: 70vh; max-height: 70vh; }
            .flipbook { max-height: 70vh; }
            .interactive-box { min-height: 30px !important; min-width: 55px !important; padding: 4px 10px !important; }
            .emoji-container { min-width: 55px !important; min-height: 55px !important; padding: 5px !important; }
            .hidden-emoji { font-size: clamp(2.8rem, 9vw, 5rem) !important; }
            .emoji-cover span { font-size: clamp(2rem, 5vw, 3.5rem) !important; }
            .word-box { font-size: clamp(1rem, 2.5vw, 1.8rem) !important; }
            .hidden-word { font-size: clamp(1.4rem, 3.5vw, 2.8rem) !important; }
            .word-cover { font-size: clamp(1.6rem, 4vw, 3rem) !important; }
            .cover h1 { font-size: clamp(1.4rem, 3.5vw, 2.5rem) !important; }
            .page-title { font-size: clamp(1.4rem, 3.5vw, 2.5rem) !important; }
            .mode-select-wrap { bottom: 16px; }
        }
    </style>
</head>
<body>
    <!-- Home -->
    <a href="../index.html" class="home-btn">🏠 ទំព័រដើម</a>

    <!-- Mode Selector -->
    <div class="mode-select-wrap">
        <label for="modeSelect">របៀបបង្ហាញ</label>
        <select id="modeSelect">
            <option value="word-cover" selected>📝 បិទបាំងពាក្យ</option>
            <option value="image-cover">🖼️ បិទបាំងរូប</option>
            <option value="normal">👁️ ធម្មតា</option>
        </select>
    </div>

    <div class="page-indicator" id="pageIndicator">គម្របខាងមុខ</div>

    <!-- The Book -->
    <div class="flipbook-wrapper" id="wrapper">
        <div class="flipbook" id="flipbook">

            <!-- SPREAD 0: FRONT COVER (full width) -->
            <div class="page cover" data-page="0">
                <h1 id="coverTitle">📖 ខ្ញុំអាចមើលឃើញ</h1>
                <div class="sub" id="coverSub">✦ អូសដើម្បីស្វែងយល់ ✦</div>
            </div>

            <!-- SPREAD 1: Empty (left) + Title page (right) -->
            <div class="page page-left empty-page" data-page="1"><span style="opacity:0.2;">·</span></div>
            <div class="page page-right" data-page="2">
                <div class="page-title" id="titlePage">ខ្ញុំ អាច មើល ឃើញ</div>

            <!-- SPREAD 4: CAT (left: sentence, right: emoji) -->
            <div class="page page-left" data-page="7">
                <div class="sentence-container">
                    <span class="word-box pattern-word" data-pattern="1">ខ្ញុំ</span>

            <div class="page page-left" data-page="13">

                    <span class="word-box pattern-word" data-pattern="2">អាច</span>
                    <span class="word-box pattern-word" data-pattern="3">មើល</span>

                    <div class="interactive-box" id="Box6">

            <!-- SPREAD 8: BACK COVER (full width) -->
            <div class="page back-cover" data-page="15">
                <div style="font-size: clamp(2.2rem, 5.5vw, 3.8rem); margin-bottom: 0.1rem;" id="backEmoji">📚</div>
                <div id="backText" style="font-size: clamp(1.2rem, 2.5vw, 2rem);">ចប់ហើយ</div>
                <div class="sub" id="backSub">✦ អរគុណ ✦</div>
            </div>

            <!-- Touch Zones -->
            <div class="touch-zones-container">
                <div class="touch-zone touch-left" id="touchLeft"></div>
                <div class="touch-zone touch-right" id="touchRight"></div>

    <script>
        (function() {
            // ============================================================
            //  MODE SELECTION
            // ============================================================
            const modeSelect = document.getElementById('modeSelect');
            const wordCovers = document.querySelectorAll('.word-cover');
            const emojiCovers = document.querySelectorAll('.emoji-cover');
            const hiddenWords = document.querySelectorAll('.hidden-word');
            const hiddenEmojis = document.querySelectorAll('.hidden-emoji');

            function setMode(mode) {
                wordCovers.forEach(cover => cover.style.display = 'none');
                emojiCovers.forEach(cover => cover.style.display = 'none');
                hiddenWords.forEach(word => word.style.opacity = '1');
                hiddenEmojis.forEach(emoji => emoji.style.opacity = '1');

                if (mode === 'word-cover') {
                    wordCovers.forEach(cover => cover.style.display = 'flex');
                    hiddenWords.forEach(word => word.style.opacity = '0.3');
                } else if (mode === 'image-cover') {
                    emojiCovers.forEach(cover => cover.style.display = 'flex');
                    hiddenEmojis.forEach(emoji => emoji.style.opacity = '0.3');
                }
            }

            modeSelect.addEventListener('change', function() { setMode(this.value); });
            setMode(modeSelect.value);

            // ============================================================
            //  FLIPBOOK CORE
            // ============================================================
            const pageIndicator = document.getElementById('pageIndicator');
            const wrapper = document.getElementById('wrapper');
            const pages = document.querySelectorAll('.page');
            const touchLeft = document.getElementById('touchLeft');
            const touchRight = document.getElementById('touchRight');
            const flipbookEl = document.getElementById('flipbook');

            // Pages: 0=cover, 1-2=title spread (empty+title), 3-4=flower, 5-6=dog, 7-8=cat, 9-10=car, 11-12=tree, 13-14=sun, 15=back
            // Spread n (n=1..7) contains pages (2n-1, 2n): spread1={1,2}, spread2={3,4}, spread3={5,6}, spread4={7,8}, spread5={9,10}, spread6={11,12}, spread7={13,14}
            const TOTAL_PAGES = 16;
            const SPREADS = 9; // 0:cover, 1:title, 2:flower, 3:dog, 4:cat, 5:car, 6:tree, 7:sun, 8:back
            let currentSpread = 0;
            let isFlipping = false;

            const spreadLabels = [
                'គម្របខាងមុខ', 'ទំព័រចំណងជើង', 'ផ្កា', 'ឆ្កែ',
                'ឆ្មា', 'ឡាន', 'ដើមឈើ', 'ព្រះអាទិត្យ', 'គម្របខាងក្រោយ'
            ];

            // ============================================================
            //  DRAG SYSTEM
            // ============================================================
            const dragInstances = [];

            function createDragInstance(coverId, textId, containerId, isEmoji = false) {
                const cover = document.getElementById(coverId);
                const text = document.getElementById(textId);
                const container = document.getElementById(containerId);
                if (!cover || !text || !container) return null;

                let isDragging = false;
                let dragStartX = 0, dragStartY = 0;
                let currentX = 0, currentY = 0;
                let elementStartX = 0, elementStartY = 0;
                let isRevealed = false;
                const SNAP_THRESHOLD = 35;
                const REVEAL_THRESHOLD = 60;

                function setPosition(x, y, animate = false) {
                    currentX = x; currentY = y;
                    if (animate) cover.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    else cover.style.transition = 'none';
                    cover.style.transform = `translate(${x}px, ${y}px)`;
                    const distance = Math.sqrt(x * x + y * y);
                    if (distance > REVEAL_THRESHOLD && !isRevealed) {
                        isRevealed = true;
                        text.style.opacity = '1';
                    } else if (distance <= REVEAL_THRESHOLD && isRevealed) {
                        isRevealed = false;
                        const currentMode = modeSelect.value;
                        if (currentMode === 'word-cover' && !isEmoji) text.style.opacity = '0.3';
                        else if (currentMode === 'image-cover' && isEmoji) text.style.opacity = '0.3';
                        else text.style.opacity = '1';
                    }
                }

                function snapToOrigin() {
                    setPosition(0, 0, true);
                    setTimeout(() => { cover.style.transition = ''; }, 500);
                }

                function onDragStart(e) {
                    if (isFlipping) return;
                    const touch = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    dragStartX = touch.clientX;
                    dragStartY = touch.clientY;
                    elementStartX = currentX;
                    elementStartY = currentY;
                    cover.classList.add('dragging');
                    cover.style.transition = 'none';
                    e.preventDefault();
                    e.stopPropagation();
                }

                function onDragMove(e) {
                    if (!isDragging) return;
                    const touch = e.touches ? e.touches[0] : e;
                    const deltaX = touch.clientX - dragStartX;
                    const deltaY = touch.clientY - dragStartY;
                    let newX = Math.max(-200, Math.min(200, elementStartX + deltaX));
                    let newY = Math.max(-200, Math.min(200, elementStartY + deltaY));
                    setPosition(newX, newY, false);
                    e.preventDefault();
                    e.stopPropagation();
                }

                function onDragEnd(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    cover.classList.remove('dragging');
                    const distance = Math.sqrt(currentX * currentX + currentY * currentY);
                    if (distance < SNAP_THRESHOLD) snapToOrigin();
                    else cover.style.transition = '';
                    e.preventDefault();
                    e.stopPropagation();
                }

                cover.addEventListener('mousedown', onDragStart);
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
                cover.addEventListener('touchstart', onDragStart, { passive: false });
                document.addEventListener('touchmove', onDragMove, { passive: false });
                document.addEventListener('touchend', onDragEnd, { passive: false });
                cover.addEventListener('click', e => e.stopPropagation());

                return { setPosition, snapToOrigin, reset: () => setPosition(0, 0, false) };
            }

            // Word covers
            const wordConfigs = [
                { cover: 'Cover1', text: 'Text1', box: 'Box1' },
                { cover: 'Cover2', text: 'Text2', box: 'Box2' },
                { cover: 'Cover3', text: 'Text3', box: 'Box3' },
                { cover: 'Cover4', text: 'Text4', box: 'Box4' },
                { cover: 'Cover5', text: 'Text5', box: 'Box5' },
                { cover: 'Cover6', text: 'Text6', box: 'Box6' }
            ];
            wordConfigs.forEach(cfg => {
                const inst = createDragInstance(cfg.cover, cfg.text, cfg.box, false);
                if (inst) { dragInstances.push(inst); inst.reset(); }
            });

            // Emoji covers
            const emojiConfigs = [
                { cover: 'EmojiCover1', text: 'Emoji1', container: 'EmojiContainer1' },
                { cover: 'EmojiCover2', text: 'Emoji2', container: 'EmojiContainer2' },
                { cover: 'EmojiCover3', text: 'Emoji3', container: 'EmojiContainer3' },
                { cover: 'EmojiCover4', text: 'Emoji4', container: 'EmojiContainer4' },
                { cover: 'EmojiCover5', text: 'Emoji5', container: 'EmojiContainer5' },
                { cover: 'EmojiCover6', text: 'Emoji6', container: 'EmojiContainer6' }
            ];
            emojiConfigs.forEach(cfg => {
                const inst = createDragInstance(cfg.cover, cfg.text, cfg.container, true);
                if (inst) { dragInstances.push(inst); inst.reset(); }
            });

            // ============================================================
            //  PAGE TURNING
            // ============================================================
            const FLIP_MS = 700;

            // Correct page-to-spread mapping:
            //   page 0            -> spread 0 (front cover)
            //   pages 1,2         -> spread 1 (empty left / title right)
            //   pages 3,4         -> spread 2 (flower)
            //   pages 5,6         -> spread 3 (dog)
            //   pages 7,8         -> spread 4 (cat)
            //   pages 9,10        -> spread 5 (car)
            //   pages 11,12       -> spread 6 (tree)
            //   pages 13,14       -> spread 7 (sun)
            //   page 15           -> spread 8 (back cover)
            function pageToSpread(pageNum) {
                if (pageNum === 0) return 0;
                if (pageNum === 15) return 8;
                return Math.ceil(pageNum / 2);
            }

            function updateFlip() {
                pages.forEach(page => {
                    const pageNum = parseInt(page.getAttribute('data-page'), 10);
                    const pageSpread = pageToSpread(pageNum);

                    // Special styling for cover and back cover (full width)
                    if (pageNum === 0 || pageNum === 15) {
                        page.style.width = '100%';
                        page.style.left = '0';
                        page.style.borderRadius = '8px';
                        page.style.borderRight = pageNum === 0 ? '2px solid #1d3442' : '2px solid #1d3442';
                        page.style.borderLeft = pageNum === 15 ? '2px solid #1d3442' : '2px solid #1d3442';
                    } else {
                        const isLeft = (pageNum % 2 === 1);
                        page.style.width = '50%';
                        page.style.left = isLeft ? '0' : '50%';
                        page.style.borderRadius = isLeft ? '8px 0 0 8px' : '0 8px 8px 0';
                        page.style.borderRight = isLeft ? '1px solid #d0c0ac' : '1px solid #d0c0ac';
                        page.style.borderLeft = isLeft ? '1px solid #d0c0ac' : '1px solid #d0c0ac';
                    }

                    if (pageSpread < currentSpread) {
                        if (pageNum !== 0 && pageNum !== 15) {
                            if (pageNum % 2 === 1) page.style.transform = 'rotateY(0deg)';
                            else page.style.transform = 'rotateY(-180deg)';
                        } else {
                            page.style.transform = 'rotateY(0deg)';
                        }
                        page.style.zIndex = 10 + pageSpread;
                        page.style.filter = 'brightness(0.92) drop-shadow(-2px 0 6px rgba(0,0,0,0.06))';
                    } else if (pageSpread === currentSpread) {
                        page.style.transform = 'rotateY(0deg)';
                        page.style.zIndex = 150;
                        page.style.filter = 'brightness(1) drop-shadow(0 0 6px rgba(0,0,0,0.02))';
                    } else {
                        if (pageNum === 0 || pageNum === 15) {
                            page.style.transform = 'rotateY(0deg)';
                        } else {
                            if (pageNum % 2 === 1) page.style.transform = 'rotateY(180deg)';
                            else page.style.transform = 'rotateY(0deg)';
                        }
                        page.style.zIndex = 10 + (TOTAL_PAGES - pageNum);
                        page.style.filter = 'brightness(0.96) drop-shadow(2px 0 8px rgba(0,0,0,0.04))';
                    }

                    // Hide pages that should not be visible
                    if (pageSpread === currentSpread) {
                        page.style.display = 'flex';
                    } else {
                        page.style.display = 'none';
                    }
                });

                if (currentSpread < spreadLabels.length) pageIndicator.textContent = spreadLabels[currentSpread];

                // Handle cover-only and back-only states
                if (currentSpread === 0) {
                    flipbookEl.classList.add('cover-only');
                    flipbookEl.classList.remove('back-only');
                    document.querySelector('.page[data-page="0"]').style.display = 'flex';
                } else {
                    flipbookEl.classList.remove('cover-only');
                }
                
                if (currentSpread === SPREADS - 1) {
                    flipbookEl.classList.add('back-only');
                    flipbookEl.classList.remove('cover-only');
                    document.querySelector('.page[data-page="15"]').style.display = 'flex';
                } else {
                    flipbookEl.classList.remove('back-only');
                }
            }

            // Determine which two page elements animate for a given transition.
            // Uses the same spread definition as pageToSpread() above, so the
            // page that "leaves" and the page that "enters" are always the
            // correct physical pages for that spread.
            function getFlipPages(oldSpread, newSpread, dir) {
                if (dir === 1) {
                    if (oldSpread === 0) {
                        return {
                            leaving: document.querySelector('.page[data-page="0"]'),
                            entering: document.querySelector('.page[data-page="1"]')
                        };
                    } else if (newSpread === 8) {
                        return {
                            leaving: document.querySelector('.page[data-page="14"]'),
                            entering: document.querySelector('.page[data-page="15"]')
                        };
                    } else {
                        return {
                            leaving: document.querySelector(`.page[data-page="${oldSpread * 2}"]`),
                            entering: document.querySelector(`.page[data-page="${newSpread * 2 - 1}"]`)
                        };
                    }
                } else {
                    if (newSpread === 0) {
                        return {
                            leaving: document.querySelector('.page[data-page="1"]'),
                            entering: document.querySelector('.page[data-page="0"]')
                        };
                    } else if (oldSpread === 8) {
                        return {
                            leaving: document.querySelector('.page[data-page="15"]'),
                            entering: document.querySelector('.page[data-page="14"]')
                        };
                    } else {
                        return {
                            leaving: document.querySelector(`.page[data-page="${oldSpread * 2 - 1}"]`),
                            entering: document.querySelector(`.page[data-page="${newSpread * 2}"]`)
                        };
                    }
                }
            }

            function playFlipAnimation(el, name) {
                if (!el) return;
                el.style.display = 'flex';
                el.style.zIndex = 500;
                el.style.animation = 'none';
                void el.offsetWidth;
                el.style.animation = `${name} ${FLIP_MS}ms cubic-bezier(0.45, 0.05, 0.55, 0.95) both`;
            }

            function goToSpread(spreadIndex) {
                if (isFlipping) return;
                if (spreadIndex < 0 || spreadIndex >= SPREADS || spreadIndex === currentSpread) return;
                isFlipping = true;

                const oldSpread = currentSpread;
                const dir = spreadIndex > currentSpread ? 1 : -1;
                const { leaving, entering } = getFlipPages(oldSpread, spreadIndex, dir);

                currentSpread = spreadIndex;
                updateFlip();

                if (leaving && entering) {
                    playFlipAnimation(leaving, dir === 1 ? 'flipLeaveForward' : 'flipLeaveBackward');
                    playFlipAnimation(entering, dir === 1 ? 'flipEnterForward' : 'flipEnterBackward');
                }

                setTimeout(() => {
                    if (leaving) leaving.style.animation = '';
                    if (entering) entering.style.animation = '';
                    updateFlip();
                    isFlipping = false;
                }, FLIP_MS);
            }

            // ============================================================
            //  EVENT LISTENERS
            // ============================================================
            touchLeft.addEventListener('click', function(e) {
                if (isFlipping) return;
                if (currentSpread > 0) goToSpread(currentSpread - 1);
                e.stopPropagation();
            });

            touchRight.addEventListener('click', function(e) {
                if (isFlipping) return;
                if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
                e.stopPropagation();
            });

            document.addEventListener('keydown', function(e) {
                if (isFlipping) return;
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    if (currentSpread > 0) goToSpread(currentSpread - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                    if (currentSpread < SPREADS - 1) goToSpread(currentSpread + 1);
                    e.preventDefault();
                }
            });

            wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

            function handleResize() { updateFlip(); }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', function() { setTimeout(handleResize, 300); });

            // ============================================================
            //  INIT - Start with cover page only
            // ============================================================
            currentSpread = 0;
            updateFlip();
        })();
    </script>
