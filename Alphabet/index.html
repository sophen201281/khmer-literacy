<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Letter Table</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Khmer OS', 'Khmer OS Battambang', Arial, sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(10px, 3vw, 40px);
    -webkit-user-select: none;
    user-select: none;
  }

  #title {
    font-size: clamp(20px, 6vw, 34px);
    font-weight: bold;
    color: #333;
    margin-bottom: clamp(8px, 2vw, 16px);
    text-align: center;
  }

  #boardWrap {
    position: relative;
    width: min(92vw, 500px);
  }

  #letterGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: clamp(4px, 1vw, 10px);
    width: 100%;
    aspect-ratio: 5 / 7;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #555;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    background-color: #ffffff;
    color: white;
    font-weight: bold;
    font-size: clamp(14px, 4vw, 24px);
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    background-size: cover;
    background-position: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .cell:hover {
    transform: scale(1.08);
    background-color: transparent;
    box-shadow: 0 0 12px rgba(184, 134, 11, 0.7);
    border-color: #b8860b;
    z-index: 2;
  }
  .cell.pressed {
    transform: scale(0.95);
    background-color: #e0e0e0;
  }
  .cell.drag-over {
    box-shadow: 0 0 0 3px #2ecc71 inset;
    background-color: rgba(46, 204, 113, 0.15);
  }

  /* Extra-small phones: stack tighter, slightly smaller radius/gaps */
  @media (max-width: 380px) {
    #letterGrid {
      gap: 3px;
    }
    .cell {
      border-radius: 4px;
      border-width: 1px;
    }
  }

  /* Landscape phones / short viewports: shrink height instead of width */
  @media (max-height: 500px) {
    #boardWrap {
      width: auto;
      height: 80vh;
    }
    #letterGrid {
      width: auto;
      height: 100%;
      aspect-ratio: 5 / 7;
    }
  }

  /* Larger screens: cap max size so cells don't get huge */
  @media (min-width: 900px) {
    #boardWrap {
      width: 500px;
    }
  }

  #muteBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #555;
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
  }
  #muteBtn:hover {
    transform: scale(1.08);
  }

  .home-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 24px;
    border: 2px solid #555;
    background-color: #ffffff;
    color: #333;
    font-weight: bold;
    font-size: clamp(13px, 3.5vw, 16px);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
    transition: transform 0.15s ease;
  }
  .home-btn:hover {
    transform: scale(1.05);
  }

  /* Draggable target marker */
  #targetTray {
    display: flex;
    justify-content: center;
    margin-top: clamp(10px, 2.5vw, 20px);
  }
  #targetMarker {
    width: clamp(18px, 4.5vw, 26px);
    height: clamp(18px, 4.5vw, 26px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b 70%);
    border: 2px solid #7f1d1d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(10px, 2.5vw, 14px);
    color: #fff;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    position: relative;
    z-index: 5;
    transition: box-shadow 0.15s ease;
  }
  #targetMarker.dragging {
    cursor: grabbing;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<a href="../index.html" class="home-btn">🏠 ទំព័រដើម</a>
<button id="muteBtn" aria-label="Mute sounds">🔊</button>

<div id="title"> ព្យព្ជានៈ</div>

<div id="boardWrap">
  <div id="letterGrid"></div>
</div>

<div id="targetTray">
  <div id="targetMarker" aria-label="Target marker, drag onto any cell">🎯</div>
</div>

<script>
  const COLS = 5;
  const ROWS = 7;
  const grid = document.getElementById('letterGrid');
  const muteBtn = document.getElementById('muteBtn');
  const targetMarker = document.getElementById('targetMarker');
  const targetTray = document.getElementById('targetTray');

  let isMuted = false;
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute sounds' : 'Mute sounds');
  });

  // Change these filenames/extensions to match what's in your folders
  // Example: images/img1.jpg, images/img2.jpg ... sounds/click1.mp3, sounds/click2.mp3 ...
  const IMAGE_FOLDER = 'images/';
  const SOUND_FOLDER = 'sounds/';
  const IMAGE_EXT = '.png';
  const SOUND_EXT = '.mp3';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const cellNumber = r * COLS + c + 1; // 1..35, used to pick image/sound file
      cell.dataset.cellNumber = cellNumber;

      // Background image — e.g. images/img1.jpg, images/img2.jpg, ...
      cell.style.backgroundImage = `url('${IMAGE_FOLDER}img${cellNumber}${IMAGE_EXT}')`;

      // Play sound on click/tap, e.g. sounds/click1.mp3, sounds/click2.mp3, ...
      const activate = () => {
        if (!isMuted) {
          const audio = new Audio(`${SOUND_FOLDER}click${cellNumber}${SOUND_EXT}`);
          audio.play().catch(err => console.log('Could not play sound:', err));
        }

        cell.classList.add('pressed');
        setTimeout(() => cell.classList.remove('pressed'), 150);
      };
      cell.addEventListener('click', activate);

      grid.appendChild(cell);
    }
  }

  /* ---------- Draggable target marker: can be moved onto any cell ---------- */
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;
  let currentDragOverCell = null;

  function getCellUnderPoint(x, y) {
    targetMarker.style.pointerEvents = 'none';
    const el = document.elementFromPoint(x, y);
    targetMarker.style.pointerEvents = '';
    if (!el) return null;
    return el.closest('.cell');
  }

  function clearDragOver() {
    if (currentDragOverCell) {
      currentDragOverCell.classList.remove('drag-over');
      currentDragOverCell = null;
    }
  }

  function startDrag(clientX, clientY) {
    dragging = true;
    targetMarker.classList.add('dragging');
    const rect = targetMarker.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;

    // Switch to fixed positioning so it can move freely over the grid
    targetMarker.style.position = 'fixed';
    targetMarker.style.left = rect.left + 'px';
    targetMarker.style.top = rect.top + 'px';
    targetMarker.style.margin = '0';
    targetMarker.style.zIndex = '999';
    document.body.appendChild(targetMarker); // ensure it's above everything
  }

  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    const x = clientX - offsetX;
    const y = clientY - offsetY;
    targetMarker.style.left = x + 'px';
    targetMarker.style.top = y + 'px';

    const cell = getCellUnderPoint(clientX, clientY);
    if (cell !== currentDragOverCell) {
      clearDragOver();
      if (cell) {
        cell.classList.add('drag-over');
        currentDragOverCell = cell;
      }
    }
  }

  function endDrag(clientX, clientY) {
    if (!dragging) return;
    dragging = false;
    targetMarker.classList.remove('dragging');

    const cell = getCellUnderPoint(clientX, clientY);
    clearDragOver();

    if (cell) {
      // Snap the target marker to the top-right corner of the dropped cell,
      // so the letter/image underneath stays visible
      const cellRect = cell.getBoundingClientRect();
      const markerSize = targetMarker.offsetWidth;
      const inset = markerSize * 0.35; // partially overlap the corner, not cover it
      targetMarker.style.left = (cellRect.right - inset) + 'px';
      targetMarker.style.top = (cellRect.top - inset) + 'px';
    } else {
      // Snap back to the tray if not dropped on a cell
      returnToTray();
    }
  }

  function returnToTray() {
    targetMarker.style.position = '';
    targetMarker.style.left = '';
    targetMarker.style.top = '';
    targetMarker.style.margin = '';
    targetMarker.style.zIndex = '';
    targetTray.appendChild(targetMarker);
  }

  // Pointer events cover mouse, touch, and pen in one API
  targetMarker.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    targetMarker.setPointerCapture(e.pointerId);
    startDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    e.preventDefault();
    endDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    targetMarker.classList.remove('dragging');
    clearDragOver();
    returnToTray();
  });
</script>

</body>
</html>
