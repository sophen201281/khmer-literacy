<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Letter Table</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Khmer OS', 'Khmer OS Battambang', Arial, sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(8px, 2.5vh, 40px) clamp(10px, 3vw, 40px);
    -webkit-user-select: none;
    user-select: none;
  }

  #title {
    font-size: clamp(16px, min(5vw, 5vh), 34px);
    font-weight: bold;
    color: #333;
    margin-bottom: clamp(6px, 1.5vh, 16px);
    text-align: center;
    flex-shrink: 0;
  }

  #boardWrap {
    position: relative;
    /* Fits by whichever dimension is tighter — width or height —
       so the 5:7 board always fits fully on screen in portrait,
       landscape, tablets, or desktops without ever overflowing. */
    width: min(92vw, calc((100vh - 120px) * 5 / 7), 500px);
    aspect-ratio: 5 / 7;
    flex-shrink: 0;
  }

  #letterGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: clamp(3px, 1vw, 10px);
    width: 100%;
    height: 100%;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #555;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    background-color: #ffffff;
    color: white;
    font-weight: bold;
    font-size: clamp(11px, min(3.5vw, 3.5vh), 24px);
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    background-size: cover;
    background-position: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .cell:hover {
    transform: scale(1.08);
    background-color: transparent;
    box-shadow: 0 0 12px rgba(184, 134, 11, 0.7);
    border-color: #b8860b;
    z-index: 2;
  }
  .cell.pressed {
    transform: scale(0.95);
    background-color: #e0e0e0;
  }
  .cell.drag-over {
    box-shadow: 0 0 0 3px #2ecc71 inset;
    background-color: rgba(46, 204, 113, 0.15);
  }

  /* While actively dragging, suppress the hover pop-out on cells so the
     board stays visually still and the drag reads as smooth */
  body.dragging-active .cell:hover {
    transform: none;
    box-shadow: none;
    border-color: #555;
  }

  /* Extra-small phones: tighter radius/border */
  @media (max-width: 380px) {
    .cell {
      border-radius: 4px;
      border-width: 1px;
    }
  }

  #muteBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #555;
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
  }
  #muteBtn:hover {
    transform: scale(1.08);
  }

  .home-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 24px;
    border: 2px solid #555;
    background-color: #ffffff;
    color: #333;
    font-weight: bold;
    font-size: clamp(13px, 3.5vw, 16px);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
    transition: transform 0.15s ease;
  }
  .home-btn:hover {
    transform: scale(1.05);
  }

  /* Draggable target marker — lives inside boardWrap so its resting
     position scales proportionally with the board on any screen size */
  #targetMarker {
    /* Cell width is roughly board-width / 5, so half a cell is
       roughly board-width / 10 — this keeps the marker sized to
       "half a cell" at any screen size, portrait or landscape. */
    width: clamp(16px, 9vw, 46px);
    height: clamp(16px, 9vw, 46px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b 70%);
    border: 2px solid #7f1d1d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(9px, 4.5vw, 22px);
    color: #fff;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 5;
    transition: box-shadow 0.15s ease;

    /* Default resting spot: on the second half (lower rows) of the
       grid, tucked at the right edge. All in %, so it re-lands in the
       same relative spot on the board at any viewport size. */
    position: absolute;
    top: 60%;
    left: 96%;
    transform: translate(-50%, -50%);
  }
  #targetMarker.dragging {
    cursor: grabbing;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<a href="../index.html" class="home-btn">🏠 ទំព័រដើម</a>
<button id="muteBtn" aria-label="Mute sounds">🔊</button>

<div id="title"> ព្យព្ជានៈ</div>

<div id="boardWrap">
  <div id="letterGrid"></div>
  <div id="targetMarker" aria-label="Target marker, drag onto any cell">🎯</div>
</div>


<script>
  const COLS = 5;
  const ROWS = 7;
  const grid = document.getElementById('letterGrid');
  const muteBtn = document.getElementById('muteBtn');
  const targetMarker = document.getElementById('targetMarker');
  const boardWrap = document.getElementById('boardWrap');

  let isMuted = false;
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute sounds' : 'Mute sounds');
  });

  // Change these filenames/extensions to match what's in your folders
  // Example: images/img1.jpg, images/img2.jpg ... sounds/click1.mp3, sounds/click2.mp3 ...
  const IMAGE_FOLDER = 'images/';
  const SOUND_FOLDER = 'sounds/';
  const IMAGE_EXT = '.png';
  const SOUND_EXT = '.mp3';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const cellNumber = r * COLS + c + 1; // 1..35, used to pick image/sound file
      cell.dataset.cellNumber = cellNumber;

      // Background image — e.g. images/img1.jpg, images/img2.jpg, ...
      cell.style.backgroundImage = `url('${IMAGE_FOLDER}img${cellNumber}${IMAGE_EXT}')`;

      // Play sound on click/tap, e.g. sounds/click1.mp3, sounds/click2.mp3, ...
      const activate = () => {
        if (!isMuted) {
          const audio = new Audio(`${SOUND_FOLDER}click${cellNumber}${SOUND_EXT}`);
          audio.play().catch(err => console.log('Could not play sound:', err));
        }

        cell.classList.add('pressed');
        setTimeout(() => cell.classList.remove('pressed'), 150);
      };
      cell.addEventListener('click', activate);

      grid.appendChild(cell);
    }
  }

  /* ---------- Draggable target marker: can be moved onto any cell ---------- */
  let dragging = false;
  let startLeft = 0;
  let startTop = 0;
  let startPointerX = 0;
  let startPointerY = 0;
  let lastPointerX = 0;
  let lastPointerY = 0;
  let rafPending = false;
  let currentDragOverCell = null;

  function getCellUnderPoint(x, y) {
    targetMarker.style.pointerEvents = 'none';
    const el = document.elementFromPoint(x, y);
    targetMarker.style.pointerEvents = '';
    if (!el) return null;
    return el.closest('.cell');
  }

  function clearDragOver() {
    if (currentDragOverCell) {
      currentDragOverCell.classList.remove('drag-over');
      currentDragOverCell = null;
    }
  }

  function startDrag(clientX, clientY) {
    dragging = true;
    document.body.classList.add('dragging-active');
    targetMarker.classList.add('dragging');
    const rect = targetMarker.getBoundingClientRect();

    // Remember the marker's starting screen position, then move it purely
    // via CSS transform (translate) during the drag. transform is handled
    // by the compositor, not layout, so it tracks the finger/cursor with
    // no jank — unlike animating left/top which forces a reflow every frame.
    startLeft = rect.left;
    startTop = rect.top;
    startPointerX = clientX;
    startPointerY = clientY;
    lastPointerX = clientX;
    lastPointerY = clientY;

    targetMarker.style.position = 'fixed';
    targetMarker.style.left = startLeft + 'px';
    targetMarker.style.top = startTop + 'px';
    targetMarker.style.margin = '0';
    targetMarker.style.zIndex = '999';
    targetMarker.style.willChange = 'transform';
    targetMarker.style.transform = 'translate(0px, 0px)';
    document.body.appendChild(targetMarker); // ensure it's above everything

    rafPending = false;
  }

  function applyMove() {
    rafPending = false;
    if (!dragging) return;
    const dx = lastPointerX - startPointerX;
    const dy = lastPointerY - startPointerY;
    targetMarker.style.transform = `translate(${dx}px, ${dy}px)`;

    const cell = getCellUnderPoint(lastPointerX, lastPointerY);
    if (cell !== currentDragOverCell) {
      clearDragOver();
      if (cell) {
        cell.classList.add('drag-over');
        currentDragOverCell = cell;
      }
    }
  }

  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    lastPointerX = clientX;
    lastPointerY = clientY;
    // Batch to one update per animation frame for buttery-smooth motion
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(applyMove);
    }
  }

  function endDrag(clientX, clientY) {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging-active');
    targetMarker.classList.remove('dragging');
    targetMarker.style.willChange = '';

    const cell = getCellUnderPoint(clientX, clientY);
    clearDragOver();

    if (cell) {
      // Snap the target marker to the middle of the dropped cell.
      // Position is stored as a % of boardWrap's own size (not px),
      // so it lands in the same relative spot on the board no matter
      // the screen size, orientation, or device afterwards.
      const cellRect = cell.getBoundingClientRect();
      const wrapRect = boardWrap.getBoundingClientRect();

      const centerXPx = cellRect.left + cellRect.width / 2 - wrapRect.left;
      const centerYPx = cellRect.top + cellRect.height / 2 - wrapRect.top;
      const leftPct = (centerXPx / wrapRect.width) * 100;
      const topPct = (centerYPx / wrapRect.height) * 100;

      targetMarker.style.position = 'absolute';
      targetMarker.style.left = leftPct + '%';
      targetMarker.style.top = topPct + '%';
      targetMarker.style.margin = '0';
      targetMarker.style.zIndex = '5';
      targetMarker.style.transform = 'translate(-50%, -50%)';
      boardWrap.appendChild(targetMarker);
    } else {
      // Not dropped on a cell — return to the default resting spot
      returnToTray();
    }
  }

  function returnToTray() {
    targetMarker.style.position = '';
    targetMarker.style.left = '';
    targetMarker.style.top = '';
    targetMarker.style.margin = '';
    targetMarker.style.zIndex = '';
    targetMarker.style.transform = '';
    targetMarker.style.willChange = '';
    boardWrap.appendChild(targetMarker);
  }

  // Pointer events cover mouse, touch, and pen in one API
  targetMarker.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    targetMarker.setPointerCapture(e.pointerId);
    startDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    e.preventDefault();
    endDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging-active');
    targetMarker.classList.remove('dragging');
    targetMarker.style.willChange = '';
    clearDragOver();
    returnToTray();
  });
</script>

</body>
</html>
