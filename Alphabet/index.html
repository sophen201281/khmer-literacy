<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Letter Table</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    height: 100dvh;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Khmer OS', 'Khmer OS Battambang', Arial, sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(8px, 2.5vh, 40px) clamp(10px, 3vw, 40px);
    padding-top: max(clamp(8px, 2.5vh, 40px), env(safe-area-inset-top));
    padding-bottom: max(clamp(8px, 2.5vh, 40px), env(safe-area-inset-bottom));
    padding-left: max(clamp(10px, 3vw, 40px), env(safe-area-inset-left));
    padding-right: max(clamp(10px, 3vw, 40px), env(safe-area-inset-right));
    -webkit-user-select: none;
    user-select: none;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #title {
    font-size: clamp(16px, min(5vw, 5vh), 34px);
    font-weight: bold;
    color: #333;
    margin-bottom: clamp(6px, 1.5vh, 16px);
    text-align: center;
    flex-shrink: 0;
  }

  #boardWrap {
    position: relative;
    /* Fits by whichever dimension is tighter — width or height —
       so the board always fits fully on screen in portrait,
       landscape, tablets, or desktops without ever overflowing.
       --board-cols / --board-rows are set by JS depending on which
       option is selected in the dropdown. */
    --board-cols: 5;
    --board-rows: 7;
    width: min(92vw, calc((100dvh - 150px) * var(--board-cols) / var(--board-rows)), 500px);
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: var(--board-cols) / var(--board-rows);
    flex-shrink: 1;
    margin: 0 auto;
  }

  #letterGrid {
    display: grid;
    grid-template-columns: repeat(var(--board-cols), 1fr);
    grid-template-rows: repeat(var(--board-rows), 1fr);
    gap: clamp(3px, 1vw, 10px);
    width: 100%;
    height: 100%;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #555;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    background-color: #ffffff;
    color: white;
    font-weight: bold;
    font-size: clamp(11px, min(3.5vw, 3.5vh), 24px);
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    background-size: cover;
    background-position: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .cell:hover {
    transform: scale(1.08);
    background-color: transparent;
    box-shadow: 0 0 12px rgba(184, 134, 11, 0.7);
    border-color: #b8860b;
    z-index: 2;
  }
  .cell.pressed {
    transform: scale(0.95);
    background-color: #e0e0e0;
  }
  .cell.drag-over {
    box-shadow: 0 0 0 3px #2ecc71 inset;
    background-color: rgba(46, 204, 113, 0.15);
  }

  /* While actively dragging, suppress the hover pop-out on cells so the
     board stays visually still and the drag reads as smooth */
  body.dragging-active .cell:hover {
    transform: none;
    box-shadow: none;
    border-color: #555;
  }

  /* Extra-small phones: tighter radius/border */
  @media (max-width: 380px) {
    .cell {
      border-radius: 4px;
      border-width: 1px;
    }
  }

  #muteBtn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #555;
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
  }
  #muteBtn:hover {
    transform: scale(1.08);
  }

  .home-btn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 24px;
    border: 2px solid #555;
    background-color: #ffffff;
    color: #333;
    font-weight: bold;
    font-size: clamp(13px, 3.5vw, 16px);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 10;
    transition: transform 0.15s ease;
  }
  .home-btn:hover {
    transform: scale(1.05);
  }

  /* Full-screen overlay for the fireworks celebration animation — sits
     above everything but never blocks clicks/drags underneath it */
  #fireworksCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1000;
  }

  /* Draggable target marker — lives inside boardWrap so its resting
     position scales proportionally with the board on any screen size */
  #targetMarker {
    /* Small marker that still scales with the board on any screen size */
    width: clamp(12px, 4vw, 22px);
    height: clamp(12px, 4vw, 22px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b 70%);
    border: 2px solid #7f1d1d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(7px, 2vw, 12px);
    color: #fff;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 5;
    transition: box-shadow 0.15s ease;
    will-change: transform;
    backface-visibility: hidden;

    /* Fallback resting spot before JS positions it exactly on cell 30
       (row 6, column 5 — near the bottom-right of the grid). All in %,
       so it lands in roughly the same relative spot at any screen size. */
    position: absolute;
    top: 79%;
    left: 96%;
    transform: translate3d(-50%, -50%, 0);
  }
  #targetMarker.dragging {
    cursor: grabbing;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }

  #seriesSelectWrap {
    margin-bottom: clamp(8px, 2vh, 18px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 14px);
  }

  /* Live preview of whichever cell the target marker currently sits on —
     sits right beside the dropdown, near the top of the page */
  .drop-preview {
    width: clamp(40px, 11vw, 72px);
    height: clamp(40px, 11vw, 72px);
    flex-shrink: 0;
    border: 2px solid #555;
    border-radius: 10px;
    background-color: #ffffff;
    background-size: cover;
    background-position: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .drop-preview.visible {
    opacity: 1;
    transform: scale(1);
  }
  #seriesSelect {
    font-family: inherit;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: bold;
    color: #333;
    background-color: #ffffff;
    border: 2px solid #555;
    border-radius: 20px;
    padding: 7px 34px 7px 16px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='3'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #seriesSelect:hover {
    transform: scale(1.03);
    box-shadow: 0 0 12px rgba(184, 134, 11, 0.5);
    border-color: #b8860b;
  }
  #seriesSelect:focus {
    outline: none;
    border-color: #b8860b;
  }
  /* Brief settle animation applied only at the moment of drop, so the
     marker doesn't feel like it's snapping abruptly — but is never
     applied while actively tracking the pointer (that stays 1:1). */
  #targetMarker.settling {
    transition: left 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Short/landscape screens (e.g. phone rotated sideways): shrink the
     header controls so the board keeps as much vertical room as possible */
  @media (max-height: 500px) {
    body {
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    #title {
      font-size: clamp(13px, 4vh, 22px);
      margin-bottom: clamp(3px, 1vh, 8px);
    }
    #seriesSelectWrap {
      margin-bottom: clamp(4px, 1vh, 10px);
    }
    #seriesSelect {
      font-size: clamp(11px, 3vh, 15px);
      padding: 4px 30px 4px 14px;
    }
    .drop-preview {
      width: clamp(32px, 8vh, 50px);
      height: clamp(32px, 8vh, 50px);
    }
    #muteBtn {
      width: 38px;
      height: 38px;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
    }
    .home-btn {
      padding: 5px 10px;
      font-size: clamp(11px, 3vh, 14px);
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
    }
  }

  /* Very small phones in portrait: tighten the fixed buttons too */
  @media (max-width: 340px) {
    #muteBtn {
      width: 40px;
      height: 40px;
      top: 10px;
      right: 10px;
    }
    .home-btn {
      padding: 6px 10px;
      font-size: 12px;
      top: 10px;
      left: 10px;
    }
  }

  /* Foldables / large tablets in portrait: let the board grow a bit
     beyond the base 500px cap while keeping proportions */
  @media (min-width: 900px) {
    #boardWrap {
      width: min(60vw, calc((100dvh - 150px) * var(--board-cols) / var(--board-rows)), 640px);
    }
  }
</style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<a href="../index.html" class="home-btn">🏠 ទំព័រដើម</a>
<button id="muteBtn" aria-label="Mute sounds">🔊</button>

<div id="title"> ព្យព្ជានៈ</div>

<div id="seriesSelectWrap">
  <select id="seriesSelect" aria-label="Select table">
    <option value="alphabet">អក្សរ (Alphabet)</option>
    <option value="series1">ស៊េរីទី១ (First Series)</option>
    <option value="series2">ស៊េរីទី២ (Second Series)</option>
  </select>
  <div id="dropPreview" class="drop-preview" aria-live="polite" aria-label="Selected cell preview"></div>
  <div id="clickPreview" class="drop-preview" aria-live="polite" aria-label="Clicked cell preview"></div>
</div>

<div id="boardWrap">
  <div id="letterGrid"></div>
  <div id="targetMarker" aria-label="Target marker, drag onto any cell">🎯</div>
</div>


<script>
  const grid = document.getElementById('letterGrid');
  const muteBtn = document.getElementById('muteBtn');
  const targetMarker = document.getElementById('targetMarker');
  const boardWrap = document.getElementById('boardWrap');
  const titleEl = document.getElementById('title');
  const seriesSelect = document.getElementById('seriesSelect');
  const dropPreview = document.getElementById('dropPreview');
  const clickPreview = document.getElementById('clickPreview');
  const fireworksCanvas = document.getElementById('fireworksCanvas');
  const fireworksCtx = fireworksCanvas.getContext('2d');

  let lastDropCellNumber = null;
  let lastClickCellNumber = null;

  // Shows whichever cell the marker currently sits on, in the small
  // preview box next to the dropdown. Pass null to hide it.
  function updateDropPreview(cell) {
    lastDropCellNumber = cell ? cell.dataset.cellNumber : null;
    if (!cell) {
      dropPreview.classList.remove('visible');
      return;
    }
    dropPreview.style.backgroundImage = cell.style.backgroundImage;
    dropPreview.classList.add('visible');
    checkPreviewMatch();
  }

  // Shows whichever cell was just clicked/tapped, in the small preview
  // box beside the first one. Pass null to hide it.
  function updateClickPreview(cell) {
    lastClickCellNumber = cell ? cell.dataset.cellNumber : null;
    if (!cell) {
      clickPreview.classList.remove('visible');
      return;
    }
    clickPreview.style.backgroundImage = cell.style.backgroundImage;
    clickPreview.classList.add('visible');
    checkPreviewMatch();
  }

  // When both preview boxes show the same cell, celebrate with a
  // fireworks burst right over the two boxes.
  function checkPreviewMatch() {
    if (lastDropCellNumber !== null && lastClickCellNumber !== null &&
        lastDropCellNumber === lastClickCellNumber) {
      celebrateMatch();
    }
  }

  /* ---------- Fireworks celebration animation ---------- */
  let fireworkParticles = [];
  let fireworksRafRunning = false;

  function resizeFireworksCanvas() {
    fireworksCanvas.width = window.innerWidth;
    fireworksCanvas.height = window.innerHeight;
  }
  resizeFireworksCanvas();
  window.addEventListener('resize', resizeFireworksCanvas);

  function spawnFireworkBurst(x, y, hue) {
    const count = 36;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 2 + Math.random() * 4;
      fireworkParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.014,
        size: 2 + Math.random() * 2,
        color: `hsl(${hue + Math.random() * 30 - 15}, 90%, 60%)`
      });
    }
    if (!fireworksRafRunning) {
      fireworksRafRunning = true;
      requestAnimationFrame(animateFireworks);
    }
  }

  function animateFireworks() {
    fireworksCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

    fireworkParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05; // gravity
      p.life -= p.decay;
    });
    fireworkParticles = fireworkParticles.filter(p => p.life > 0);

    fireworkParticles.forEach(p => {
      fireworksCtx.globalAlpha = Math.max(p.life, 0);
      fireworksCtx.fillStyle = p.color;
      fireworksCtx.beginPath();
      fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fireworksCtx.fill();
    });
    fireworksCtx.globalAlpha = 1;

    if (fireworkParticles.length > 0) {
      requestAnimationFrame(animateFireworks);
    } else {
      fireworksRafRunning = false;
    }
  }

  // Launches a small cluster of bursts centered over the two preview
  // boxes, so the celebration reads as coming from the matched pair.
  function celebrateMatch() {
    const rect1 = dropPreview.getBoundingClientRect();
    const rect2 = clickPreview.getBoundingClientRect();
    const originX = (rect1.left + rect1.width / 2 + rect2.left + rect2.width / 2) / 2;
    const originY = Math.min(rect1.top, rect2.top) + Math.max(rect1.height, rect2.height) / 2;

    const hues = [0, 45, 130, 200, 280];
    hues.forEach((hue, i) => {
      setTimeout(() => {
        spawnFireworkBurst(
          originX + (Math.random() * 40 - 20),
          originY + (Math.random() * 20 - 10),
          hue
        );
      }, i * 120);
    });
  }

  let isMuted = false;
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute sounds' : 'Mute sounds');
  });

  // Each option in the dropdown maps to one of these configs.
  // Change folder paths / extensions / titles / default marker cell here
  // to match whatever assets exist for that series.
  const DATASETS = {
    alphabet: {
      cols: 5,
      rows: 7,
      imageFolder: 'images/',
      soundFolder: 'sounds/',
      imageExt: '.png',
      soundExt: '.mp3',
      title: ' ព្យព្ជានៈ',
      defaultCell: 30
    },
    series1: {
      cols: 6,
      rows: 8,
      imageFolder: 'images/series1/',
      soundFolder: 'sounds/series1/',
      imageExt: '.png',
      soundExt: '.mp3',
      title: ' ស៊េរីទី១',
      defaultCell: 48
    },
    series2: {
      cols: 6,
      rows: 8,
      imageFolder: 'images/series2/',
      soundFolder: 'sounds/series2/',
      imageExt: '.png',
      soundExt: '.mp3',
      title: ' ស៊េរីទី២',
      defaultCell: 48
    }
  };

  // Mutable "current" values, referenced by cell click handlers.
  // These get reassigned every time buildBoard() runs.
  let COLS = 5;
  let ROWS = 7;
  let IMAGE_FOLDER = 'images/';
  let SOUND_FOLDER = 'sounds/';
  let IMAGE_EXT = '.png';
  let SOUND_EXT = '.mp3';

  function buildBoard(key) {
    const config = DATASETS[key];
    if (!config) return;

    COLS = config.cols;
    ROWS = config.rows;
    IMAGE_FOLDER = config.imageFolder;
    SOUND_FOLDER = config.soundFolder;
    IMAGE_EXT = config.imageExt;
    SOUND_EXT = config.soundExt;

    // Update the grid's column/row count so CSS (which reads these
    // custom properties) resizes the board and cells automatically.
    boardWrap.style.setProperty('--board-cols', COLS);
    boardWrap.style.setProperty('--board-rows', ROWS);

    titleEl.textContent = config.title;

    grid.innerHTML = '';
    updateClickPreview(null);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const cellNumber = r * COLS + c + 1; // used to pick image/sound file
        cell.dataset.cellNumber = cellNumber;

        // Background image — e.g. images/series1/img1.png, ...
        cell.style.backgroundImage = `url('${IMAGE_FOLDER}img${cellNumber}${IMAGE_EXT}')`;

        // Play sound on click/tap, e.g. sounds/series1/click1.mp3, ...
        const activate = () => {
          if (!isMuted) {
            const audio = new Audio(`${SOUND_FOLDER}click${cellNumber}${SOUND_EXT}`);
            audio.play().catch(err => console.log('Could not play sound:', err));
          }

          cell.classList.add('pressed');
          setTimeout(() => cell.classList.remove('pressed'), 150);
          updateClickPreview(cell);
        };
        cell.addEventListener('click', activate);

        grid.appendChild(cell);
      }
    }

    // Wait a frame so the board has its new size before placing the marker
    requestAnimationFrame(() => positionMarkerOnCell(config.defaultCell));
  }

  seriesSelect.addEventListener('change', () => {
    buildBoard(seriesSelect.value);
  });

  buildBoard('alphabet');

  /* ---------- Draggable target marker: can be moved smoothly to any spot ---------- */
  let dragging = false;
  let startLeft = 0;
  let startTop = 0;
  let startPointerX = 0;
  let startPointerY = 0;
  let lastPointerX = 0;
  let lastPointerY = 0;
  let rafPending = false;
  let currentDragOverCell = null;

  function getCellUnderPoint(x, y) {
    targetMarker.style.pointerEvents = 'none';
    const el = document.elementFromPoint(x, y);
    targetMarker.style.pointerEvents = '';
    if (!el) return null;
    return el.closest('.cell');
  }

  function clearDragOver() {
    if (currentDragOverCell) {
      currentDragOverCell.classList.remove('drag-over');
      currentDragOverCell = null;
    }
  }

  // Places the marker centered on a given cell number (1..35), using the
  // same %-of-board math as a manual drop, so it lands correctly and stays
  // correct on any screen size or orientation.
  function positionMarkerOnCell(cellNumber) {
    const cell = grid.querySelector(`.cell[data-cell-number="${cellNumber}"]`);
    if (!cell) return;

    const cellRect = cell.getBoundingClientRect();
    const wrapRect = boardWrap.getBoundingClientRect();

    const centerXPx = cellRect.left + cellRect.width / 2 - wrapRect.left;
    const centerYPx = cellRect.top + cellRect.height / 2 - wrapRect.top;
    const leftPct = (centerXPx / wrapRect.width) * 100;
    const topPct = (centerYPx / wrapRect.height) * 100;

    targetMarker.style.position = 'absolute';
    targetMarker.style.left = leftPct + '%';
    targetMarker.style.top = topPct + '%';
    targetMarker.style.margin = '0';
    targetMarker.style.zIndex = '5';
    targetMarker.style.transform = 'translate3d(-50%, -50%, 0)';
    boardWrap.appendChild(targetMarker);

    updateDropPreview(cell);
  }

  function startDrag(clientX, clientY) {
    dragging = true;
    document.body.classList.add('dragging-active');
    targetMarker.classList.add('dragging');
    targetMarker.classList.remove('settling');
    const rect = targetMarker.getBoundingClientRect();

    // Remember the marker's starting screen position, then move it purely
    // via CSS transform (translate) during the drag. transform is handled
    // by the compositor, not layout, so it tracks the finger/cursor with
    // no jank — unlike animating left/top which forces a reflow every frame.
    startLeft = rect.left;
    startTop = rect.top;
    startPointerX = clientX;
    startPointerY = clientY;
    lastPointerX = clientX;
    lastPointerY = clientY;

    targetMarker.style.position = 'fixed';
    targetMarker.style.left = startLeft + 'px';
    targetMarker.style.top = startTop + 'px';
    targetMarker.style.margin = '0';
    targetMarker.style.zIndex = '999';
    targetMarker.style.willChange = 'transform';
    targetMarker.style.transform = 'translate3d(0px, 0px, 0)';
    document.body.appendChild(targetMarker); // ensure it's above everything

    rafPending = false;
  }

  function applyMove() {
    rafPending = false;
    if (!dragging) return;
    const dx = lastPointerX - startPointerX;
    const dy = lastPointerY - startPointerY;
    targetMarker.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

    // Purely cosmetic highlight of whichever cell is currently underneath —
    // this no longer restricts where the marker can be dropped.
    const cell = getCellUnderPoint(lastPointerX, lastPointerY);
    if (cell !== currentDragOverCell) {
      clearDragOver();
      if (cell) {
        cell.classList.add('drag-over');
        currentDragOverCell = cell;
        updateDropPreview(cell);
      }
    }
  }

  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    lastPointerX = clientX;
    lastPointerY = clientY;
    // Batch to one update per animation frame for buttery-smooth motion
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(applyMove);
    }
  }

  function endDrag(clientX, clientY) {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging-active');
    targetMarker.classList.remove('dragging');
    targetMarker.style.willChange = '';

    const droppedCell = getCellUnderPoint(clientX, clientY);
    clearDragOver();
    updateDropPreview(droppedCell);

    // Free placement: drop the marker exactly where it was released,
    // anywhere on the board — not restricted to a cell. Position is
    // clamped to stay fully inside boardWrap, and stored as a % of the
    // board's own size so it stays correctly placed on any screen size.
    const wrapRect = boardWrap.getBoundingClientRect();
    const markerRect = targetMarker.getBoundingClientRect();
    const markerHalfW = markerRect.width / 2;
    const markerHalfH = markerRect.height / 2;

    let xPx = clientX - wrapRect.left;
    let yPx = clientY - wrapRect.top;

    xPx = Math.min(Math.max(xPx, markerHalfW), wrapRect.width - markerHalfW);
    yPx = Math.min(Math.max(yPx, markerHalfH), wrapRect.height - markerHalfH);

    const leftPct = (xPx / wrapRect.width) * 100;
    const topPct = (yPx / wrapRect.height) * 100;

    // Briefly enable a smooth settle transition for the final snap into
    // place, then remove it so future drags stay perfectly 1:1 with the
    // pointer (no lag).
    targetMarker.classList.add('settling');
    targetMarker.style.position = 'absolute';
    targetMarker.style.left = leftPct + '%';
    targetMarker.style.top = topPct + '%';
    targetMarker.style.margin = '0';
    targetMarker.style.zIndex = '5';
    targetMarker.style.transform = 'translate3d(-50%, -50%, 0)';
    boardWrap.appendChild(targetMarker);

    setTimeout(() => targetMarker.classList.remove('settling'), 200);
  }

  function returnToTray() {
    targetMarker.classList.remove('settling');
    targetMarker.style.position = '';
    targetMarker.style.left = '';
    targetMarker.style.top = '';
    targetMarker.style.margin = '';
    targetMarker.style.zIndex = '';
    targetMarker.style.transform = '';
    targetMarker.style.willChange = '';
    boardWrap.appendChild(targetMarker);
  }

  // Pointer events cover mouse, touch, and pen in one API
  targetMarker.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    targetMarker.setPointerCapture(e.pointerId);
    startDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    e.preventDefault();
    endDrag(e.clientX, e.clientY);
  });

  targetMarker.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging-active');
    targetMarker.classList.remove('dragging');
    targetMarker.style.willChange = '';
    clearDragOver();
    returnToTray();
  });
</script>

</body>
</html>
