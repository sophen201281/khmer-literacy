<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Consonants · 2 weeks</title>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --card-font-size: clamp(44px, 12vw, 82px);
      --image-size: clamp(56px, 16vw, 100px);
      --panel-bg: #1f2e3a;
      --panel-text: #f0ede5;
      --accent: #4a6cf7;
      --radius: 14px;
    }
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body{
      font-family: 'Battambang', 'Segoe UI', Roboto, system-ui, sans-serif;
      background:#eef3ff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:clamp(8px, 3vw, 16px);
      min-height:100vh;
      min-height:100dvh;
      height:100%;
      height:100dvh;
    }
    h2{
      margin-bottom:2px;
      font-weight:400;
      color:#1f2e3a;
      letter-spacing:1px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
      font-size:clamp(1.1rem, 4vw, 1.6rem);
      text-align:center;
    }
    .week-selector{
      display:flex;
      gap:8px;
      align-items:center;
      margin-top: 8px;
      margin-bottom: 6px;
      width:min(360px,92vw);
      justify-content:center;
      background:white;
      padding:6px 16px;
      border-radius:40px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
      flex-wrap: wrap;
      flex-shrink:0;
    }
    .week-selector label{
      font-size:15px;
      color:#445566;
      font-weight:500;
      white-space:nowrap;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector select{
      padding:6px 12px;
      border:1px solid #ccd7e6;
      border-radius:30px;
      background:white;
      font-size:15px;
      font-weight:500;
      color:#1f2e3a;
      cursor:pointer;
      outline:none;
      transition:border .2s;
      flex:1;
      min-width:120px;
      max-width:150px;
      appearance:auto;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .week-selector select:focus-visible,
    .sound-toggle-btn:focus-visible,
    .nav button:focus-visible,
    .zone-btn:focus-visible{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(74,108,247,0.25);
    }
    .sound-toggle-btn {
      background: rgba(240, 244, 250, 0.9);
      border: 1px solid #ccd7e6;
      border-radius: 40px;
      padding: 4px 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #1f2e3a;
      transition: all 0.2s;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      white-space: nowrap;
      flex-shrink:0;
    }
    .sound-toggle-btn:hover {
      background: white;
      border-color: #a0b8d0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transform: translateY(-1px);
    }
    .sound-toggle-btn:active {
      transform: scale(0.96);
    }
    .sound-toggle-btn.muted {
      opacity: 0.6;
      background: #eef0f2;
    }
    .sound-toggle-btn .icon { font-size: 18px; line-height: 1; }
    .sound-toggle-btn .label { font-size: 13px; }

    .stack-wrap{
      display:flex;
      align-items:center;
      gap: clamp(4px, 2vw, 12px);
      width:min(440px, 94vw);
      margin-bottom:6px;
      flex-shrink:0;
    }
    .zone-btn{
      flex:0 0 auto;
      width:clamp(32px, 8vw, 44px);
      height:clamp(56px, 20vh, 90px);
      border:none;
      border-radius:12px;
      background:white;
      color:#8899aa;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .15s;
    }
    .zone-btn:hover{ background:#f0f4ff; color:#1f2e3a; }
    .zone-btn:active{ transform:scale(0.92); }
    .zone-btn:disabled{ opacity:0.35; cursor:default; }
    .zone-btn:disabled:hover{ background:white; color:#8899aa; }

    .stack{
      position:relative;
      width:min(360px,92vw);
      height:min(260px, 34vh);
      min-height:150px;
      perspective:1400px;
      touch-action: pan-y;
    }
    .card{
      position:absolute;
      width:100%;
      height:100%;
      transition:opacity .3s;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      touch-action: pan-y;
    }
    .card.hidden{ opacity:0; pointer-events:none; }
    .face{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(10px,3vw,20px);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      background:white;
    }
    .consonant-area{
      flex: 0 0 auto;
      font-size: var(--card-font-size);
      font-weight: 600;
      line-height: 1.2;
      min-width: 60px;
      text-align: center;
      margin-right: 4px;
      margin-left: 5%;
      order: 1;
    }
    .image-area{
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--image-size);
      height: var(--image-size);
      background: #f0f4fa;
      border-radius: 8px;
      font-size: 30px;
      color: #8899aa;
      border: 1px dashed #ccd7e6;
      transition: all 0.2s;
      order: 2;
      margin-left: 4px;
      margin-right: 5%;
      overflow:hidden;
    }
    .image-area img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: cover;
    }
    .card::before, .card::after{
      position:absolute;
      top:0;
      width:18%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(16px, 4vw, 26px);
      color:rgba(0,0,0,.08);
      pointer-events:none;
      z-index:3;
      font-weight:300;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .card::before{ content:"‹"; left:0; }
    .card::after{ content:"›"; right:0; }

    .bottom-controls{
      width:min(360px,92vw);
      margin-top:4px;
      flex-shrink:0;
    }
    .nav{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top: 4px;
    }
    .nav button{
      padding:8px 14px;
      border:none;
      background:white;
      color:#1f2e3a;
      border-radius:40px;
      cursor:pointer;
      font-weight:500;
      font-size:clamp(12px, 3vw, 14px);
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      transition:all .2s;
      border:1px solid transparent;
      flex:1 0 auto;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }
    .nav button:hover{
      background:#f0f4ff;
      border-color:#ccd7e6;
      transform:translateY(-1px);
    }
    .nav button:active{ transform:scale(0.96); }
    .homeBtn{
      background:#eef3ff;
    }
    .empty{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:#8899aa;
      font-size:18px;
      font-style:italic;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    .admin-toggle, .admin-overlay, .admin-panel {
      display: none !important;
    }

    .counter{
      font-size:13px;
      color:#8899aa;
      margin-top:2px;
      text-align:center;
      font-family: 'Battambang', 'Segoe UI', system-ui, sans-serif;
    }

    /* Fine-tune very short / small screens so nothing gets clipped */
    @media (max-height: 700px) {
      .stack { height: min(200px, 30vh); }
    }
    @media (max-height: 550px) {
      .stack { height: min(150px, 28vh); }
      .week-selector { padding: 4px 10px; }
      .nav button { padding: 5px 10px; }
    }
    /* Larger screens: let the card breathe a bit more */
    @media (min-width: 700px) {
      .stack-wrap, .week-selector, .bottom-controls { width: 420px; }
      .stack { width: 420px; height: 300px; }
    }
    @media (min-width: 1100px) {
      .stack-wrap, .week-selector, .bottom-controls { width: 480px; }
      .stack { width: 480px; height: 340px; }
    }
  </style>
</head>
<body>

<h2>
  <span>ព្យញ្ជនៈ</span>
  <span style="font-size:16px;font-weight:300;color:#667;font-family:'Battambang','Segoe UI',system-ui,sans-serif;" id="weekDisplay">ពួក អ</span>
</h2>

<!-- week selector with integrated sound button -->
<div class="week-selector">
  <label for="weekDropdown">ក្រុមព្យញ្ជន:</label>
  <select id="weekDropdown"></select>
  <button class="sound-toggle-btn" id="globalSoundToggle" type="button" aria-label="Toggle sound">
    <span class="icon">🔊</span>
    <span class="label">សំឡេង</span>
  </button>
</div>

<!-- stack (cards) with explicit prev/next controls for mouse, touch and keyboard -->
<div class="stack-wrap">
  <button class="zone-btn" id="prevBtn" type="button" aria-label="Previous card">‹</button>
  <div class="stack" id="stack" role="group" aria-label="Flashcard" tabindex="0"></div>
  <button class="zone-btn" id="nextBtn" type="button" aria-label="Next card">›</button>
</div>

<div class="counter" id="counter"></div>

<div class="bottom-controls">
  <div class="nav">
    <button onclick="randomCard()" type="button">🎲 ក្រឡុក</button>
    <button onclick="deleteCard()" type="button">🗑 លុប</button>
    <button onclick="window.location.href='../index.html'" class="homeBtn" type="button">🏡 Home</button>
  </div>
</div>

<script>
  // ============ DATA ============
  const WEEK_COUNT = 2;

  const week1Consonants = [
    { text: 'ក', image: 'image/ក.svg', sound: 'sound/ក.mp3' },
    { text: 'ខ', image: 'image/ខ.svg', sound: 'sound/ខ.mp3' },
    { text: 'ច', image: 'image/ច.svg', sound: 'sound/ច.mp3' },
    { text: 'ឆ', image: 'image/ឆ.svg', sound: 'sound/ឆ.mp3' },
    { text: 'ដ', image: 'image/ដ.svg', sound: 'sound/ដ.mp3' },
    { text: 'ឋ', image: 'image/ឋ.svg', sound: 'sound/ឋ.mp3' },
    { text: 'ណ', image: 'image/ណ.svg', sound: 'sound/ណ.mp3' },
    { text: 'ត', image: 'image/ត.svg', sound: 'sound/ត.mp3' },
    { text: 'ថ', image: 'image/ថ.svg', sound: 'sound/ថ.mp3' },
    { text: 'ប', image: 'image/ប.svg', sound: 'sound/ប.mp3' },
    { text: 'ផ', image: 'image/ផ.svg', sound: 'sound/ផ.mp3' },
    { text: 'ស', image: 'image/ស.svg', sound: 'sound/ស.mp3' },
    { text: 'ហ', image: 'image/ហ.svg', sound: 'sound/ហ.mp3' },
    { text: 'ឡ', image: 'image/ឡ.svg', sound: 'sound/ឡ.mp3' },
    { text: 'អ', image: 'image/អ.svg', sound: 'sound/អ.mp3' }
  ];
  const week2Consonants = [
    { text: 'គ', image: 'image/គ.svg', sound: 'sound/គ.mp3' },
    { text: 'ឃ', image: 'image/ឃ.svg', sound: 'sound/ឃ.mp3' },
    { text: 'ង', image: 'image/ង.svg', sound: 'sound/ង.mp3' },
    { text: 'ជ', image: 'image/ជ.svg', sound: 'sound/ជ.mp3' },
    { text: 'ឈ', image: 'image/ឈ.svg', sound: 'sound/ឈ.mp3' },
    { text: 'ញ', image: 'image/ញ.svg', sound: 'sound/ញ.mp3' },
    { text: 'ឌ', image: 'image/ឌ.svg', sound: 'sound/ឌ.mp3' },
    { text: 'ឍ', image: 'image/ឍ.svg', sound: 'sound/ឍ.mp3' },
    { text: 'ទ', image: 'image/ទ.svg', sound: 'sound/ទ.mp3' },
    { text: 'ធ', image: 'image/ធ.svg', sound: 'sound/ធ.mp3' },
    { text: 'ន', image: 'image/ន.svg', sound: 'sound/ន.mp3' },
    { text: 'ព', image: 'image/ព.svg', sound: 'sound/ព.mp3' },
    { text: 'ភ', image: 'image/ភ.svg', sound: 'sound/ភ.mp3' },
    { text: 'ម', image: 'image/ម.svg', sound: 'sound/ម.mp3' },
    { text: 'យ', image: 'image/យ.svg', sound: 'sound/យ.mp3' },
    { text: 'រ', image: 'image/រ.svg', sound: 'sound/រ.mp3' },
    { text: 'ល', image: 'image/ល.svg', sound: 'sound/ល.mp3' },
    { text: 'វ', image: 'image/វ.svg', sound: 'sound/វ.mp3' }
  ];

  let weeksData = [
    week1Consonants.map(c => ({ text: c.text, image: c.image, sound: c.sound })),
    week2Consonants.map(c => ({ text: c.text, image: c.image, sound: c.sound }))
  ];

  let currentWeek = 0;
  let cards = [];
  let current = 0;

  let soundEnabled = true;
  let currentAudio = null;

  // ============ LOAD WEEK ============
  function loadWeek(weekIndex) {
    currentWeek = weekIndex;
    const words = weeksData[weekIndex] || [];
    cards = words.map(item => typeof item === 'string' ? { text: item, image: '', sound: '' } : item);
    current = 0;
    renderCards();
    updateWeekUI();
    const label = weekIndex === 0 ? 'ពួក អ' : 'ពួក អ៝';
    document.getElementById('weekDisplay').textContent = label;
    document.getElementById('weekDropdown').value = weekIndex;
    updateSoundButtonUI();
  }

  // ============ RENDER ============
  function renderCards(){
    const stack = document.getElementById("stack");
    stack.innerHTML = "";
    updateNavButtons();
    updateCounter();
    if(cards.length === 0){
      stack.innerHTML = `<div class="empty">មិនមានបណ្ណព្យញ្ជនៈ</div>`;
      return;
    }
    const c = cards[current];
    const card = document.createElement("div");
    card.className = "card";

    const textColor = currentWeek === 0 ? '#1a5bbf' : '#c0392b';

    let imageHtml = '';
    if (c.image && c.image.trim() !== '') {
      imageHtml = `<img src="${c.image}" alt="${c.text}" loading="lazy" onerror="this.parentElement.textContent='🖼️';">`;
    } else {
      imageHtml = '🖼️';
    }

    card.innerHTML = `
      <div class="face">
        <div class="consonant-area" style="color:${textColor};">${c.text}</div>
        <div class="image-area">${imageHtml}</div>
      </div>
    `;

    // Works for mouse, touch and pen alike (Pointer Events unify all input types).
    let startX = 0, startY = 0, moved = false;
    card.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
    });
    card.addEventListener('pointermove', (e) => {
      if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) moved = true;
    });
    card.addEventListener('pointerup', (e) => {
      const endX = e.clientX;
      const diff = endX - startX;
      const rect = card.getBoundingClientRect();
      const x = endX - rect.left;
      const w = rect.width;

      // Swipe gesture takes priority.
      if (moved && Math.abs(diff) > 60) {
        if (diff > 0) prev(); else next();
        return;
      }
      // Otherwise treat as a tap/click: left/right edge zones navigate, middle plays sound.
      if (x < w * 0.2) { prev(); return; }
      if (x > w * 0.8) { next(); return; }
      if (soundEnabled && cards[current] && cards[current].sound) {
        playSound(cards[current].sound);
      }
    });

    stack.appendChild(card);
  }

  function updateNavButtons(){
    document.getElementById('prevBtn').disabled = (current <= 0 || cards.length === 0);
    document.getElementById('nextBtn').disabled = (current >= cards.length - 1 || cards.length === 0);
  }

  function updateCounter(){
    const counter = document.getElementById('counter');
    if (cards.length === 0) { counter.textContent = ''; return; }
    counter.textContent = `${current + 1} / ${cards.length}`;
  }

  // ============ SOUND ============
  function playSound(src) {
    if (!soundEnabled) return;
    if (!src) return;
    try {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      const audio = new Audio(src);
      audio.play().catch(err => console.warn('Sound play error:', err));
      currentAudio = audio;
      audio.onended = () => { currentAudio = null; };
    } catch(e) {
      console.warn('Sound error:', e);
    }
  }

  // ============ CARD OPERATIONS ============
  function deleteCard(){
    if(!cards.length) return;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    cards.splice(current,1);
    if(current >= cards.length) current = cards.length-1;
    if(current < 0) current = 0;
    weeksData[currentWeek] = cards.map(c => ({ text: c.text, image: c.image || '', sound: c.sound || '' }));
    renderCards();
  }

  function randomCard(){
    if(cards.length < 2) return;
    let r;
    do{ r = Math.floor(Math.random()*cards.length); }while(r === current);
    current = r;
    renderCards();
    if (soundEnabled && cards[current] && cards[current].sound) {
      playSound(cards[current].sound);
    }
  }

  function next(){
    if(current < cards.length-1){
      current++;
      renderCards();
      if (soundEnabled && cards[current] && cards[current].sound) {
        playSound(cards[current].sound);
      }
    }
  }
  function prev(){
    if(current > 0){
      current--;
      renderCards();
      if (soundEnabled && cards[current] && cards[current].sound) {
        playSound(cards[current].sound);
      }
    }
  }

  // ============ KEYBOARD NAVIGATION (desktop accessibility) ============
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { prev(); }
    else if (e.key === 'ArrowRight') { next(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (soundEnabled && cards[current] && cards[current].sound) playSound(cards[current].sound);
    }
  });

  // ============ WEEK UI ============
  function updateWeekUI() {
    const dropdown = document.getElementById('weekDropdown');
    dropdown.innerHTML = '';
    const labels = ['ពួក អ', 'ពួក អ៝'];
    for (let i = 0; i < WEEK_COUNT; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = labels[i];
      dropdown.appendChild(option);
    }
    dropdown.value = currentWeek;
    const newDropdown = dropdown.cloneNode(true);
    dropdown.parentNode.replaceChild(newDropdown, dropdown);
    newDropdown.addEventListener('change', function() {
      loadWeek(parseInt(this.value));
    });
    const soundBtn = document.getElementById('globalSoundToggle');
    if (soundBtn) {
      const newBtn = soundBtn.cloneNode(true);
      soundBtn.parentNode.replaceChild(newBtn, soundBtn);
      newBtn.addEventListener('click', toggleSound);
    }
  }

  // ============ GLOBAL SOUND TOGGLE ============
  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (!soundEnabled && currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    updateSoundButtonUI();
    if (soundEnabled && cards.length > 0 && cards[current] && cards[current].sound) {
      playSound(cards[current].sound);
    }
  }

  function updateSoundButtonUI() {
    const btn = document.getElementById('globalSoundToggle');
    if (!btn) return;
    const icon = btn.querySelector('.icon');
    const label = btn.querySelector('.label');
    if (soundEnabled) {
      icon.textContent = '🔊';
      label.textContent = 'សំឡេង';
      btn.classList.remove('muted');
    } else {
      icon.textContent = '🔇';
      label.textContent = 'បិទ';
      btn.classList.add('muted');
    }
  }

  // ============ INIT ============
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtn').addEventListener('click', next);

  loadWeek(0);
  updateSoundButtonUI();

  window.deleteCard = deleteCard;
  window.randomCard = randomCard;
  window.next = next;
  window.prev = prev;
  window.loadWeek = loadWeek;
  window.toggleSound = toggleSound;
</script>

</body>
</html>
