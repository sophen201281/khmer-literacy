<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ប្រកបអាន</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF6EE;
      --card:#FFFEFB;
      --ink:#2A2622;
      --muted:#8a8272;
      --line:#E7E0D1;
      --accent:#C1652F;
      --accent-soft:#F1E3D3;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ -webkit-text-size-adjust:100%; }
    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      background:
        radial-gradient(circle at 1px 1px, #00000009 1px, transparent 0) 0 0/22px 22px,
        var(--paper);
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      color:var(--ink);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:24px clamp(10px, 3vw, 36px) 60px;
      overflow-x:hidden;
    }
    h1{
      font-family:'Battambang', Georgia, 'Times New Roman', serif;
      font-weight:700;
      font-size:clamp(22px, 5vw, 30px);
      letter-spacing:-0.01em;
      margin:0 0 4px;
      text-align:center;
    }
    .sub{
      font-size:clamp(10.5px, 2.6vw, 12px);
      color:var(--muted);
      margin-bottom:20px;
      text-transform:uppercase;
      letter-spacing:0.09em;
      text-align:center;
    }

    /* Toolbar — the "pen tray" */
    .toolbar{
      width:min(820px, 96vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px 12px;
      box-shadow:0 1px 0 #fff inset, 0 8px 20px -14px #00000030;
      margin-bottom:0;
    }
    .tool-group{
      display:flex;
      gap:6px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:10px;
      padding:4px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tool-btn{
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      font-size:clamp(12px, 3vw, 13px);
      border:none;
      background:transparent;
      color:var(--ink);
      padding:7px 10px;
      border-radius:7px;
      cursor:pointer;
      transition:background .15s, color .15s;
      white-space:nowrap;
    }
    .tool-btn:hover{ background:#00000008; }
    .tool-btn.active{
      background:var(--accent);
      color:#fff;
    }
    .sub-bar{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      width:100%;
    }
    .bar-label{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-right:2px;
      white-space:nowrap;
    }
    .hl-swatch, .pen-swatch{
      width:22px; height:22px;
      min-width:22px;
      border-radius:50%;
      border:2px solid #ffffffcc;
      outline:1px solid var(--line);
      cursor:pointer;
      padding:0;
    }
    .hl-swatch.active, .pen-swatch.active{
      outline:2px solid var(--accent);
      outline-offset:1px;
    }
    input[type="range"]{ accent-color: var(--accent); width:90px; max-width:30vw; }
    .text-btn{
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      font-size:11.5px;
      background:none;
      border:1px solid var(--line);
      color:var(--ink);
      padding:6px 10px;
      border-radius:7px;
      cursor:pointer;
      letter-spacing:.02em;
      white-space:nowrap;
    }
    .text-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
    .text-btn.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }
    .text-btn.danger{ margin-left:auto; color:#8a2f1f; }
    .text-btn.danger:hover{ background:#f6dfd8; border-color:#8a2f1f; }

    .img-select{
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      font-size:11.5px;
      background:var(--card);
      border:1px solid var(--line);
      color:var(--ink);
      padding:6px 8px;
      border-radius:7px;
      cursor:pointer;
      letter-spacing:.02em;
    }
    .img-select:hover{ border-color:var(--accent); }

    .homeBtn{
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      font-size:clamp(12px, 3vw, 13px);
      background:transparent;
      border:none;
      color:var(--ink);
      padding:7px 12px;
      border-radius:7px;
      cursor:pointer;
      white-space:nowrap;
      transition:background .15s, color .15s;
    }
    .homeBtn:hover{ background:#00000008; }
    .homeBtn:active{ transform:scale(0.96); }

    /* Stage — split into a typing/drawing half and an image half */
    .stage{
      position:relative;
      width:min(1100px, 96vw);
      margin-top:16px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 1px 0 #fff inset, 0 14px 34px -20px #00000040;
      overflow:hidden;
      display:flex;
      align-items:stretch;
    }
    .stage-half{
      position:relative;
      flex:1 1 50%;
      min-width:0;
    }
    .stage-text{
      border-right:1px solid var(--line);
    }
    .text-layer{
      position:relative;
      z-index:1;
      padding:clamp(18px, 4vw, 34px) clamp(16px, 4vw, 36px);
      min-height:320px;
      height:100%;
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
      font-size:16px;
      line-height:1.8;
      outline:none;
      white-space:pre-wrap;
      word-wrap:break-word;
      overflow-wrap:break-word;
    }
    .text-layer:empty:before{
      content: attr(data-placeholder);
      color:#b8ae9c;
    }
    .letter{
      position:absolute;
      pointer-events:none;
      user-select:none;
      white-space:pre;
      font-family:'Battambang', 'Courier New', ui-monospace, monospace;
    }
    .text-layer.move-mode .letter{
      pointer-events:auto;
      cursor:grab;
      touch-action:none;
    }
    .text-layer.move-mode .letter.dragging{
      cursor:grabbing;
      z-index:5;
    }
    .font-btn{
      font-family:Georgia, serif;
      font-weight:700;
    }
    .draw-canvas{
      position:absolute;
      top:0; left:0;
      z-index:2;
      touch-action:none;
    }

    .stage-image{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:320px;
      background:var(--paper);
      padding:16px;
      overflow:hidden;
    }
    .image-select-bar{
      position:absolute;
      top:10px;
      right:10px;
      z-index:3;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .preview-image{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:8px;
      display:block;
    }
    .image-placeholder{
      text-align:center;
      padding:24px;
      font-size:11.5px;
      color:var(--muted);
      line-height:1.6;
      max-width:220px;
    }
    .image-placeholder code{
      background:var(--accent-soft);
      padding:1px 5px;
      border-radius:4px;
    }

    .hint{
      width:min(1100px, 96vw);
      font-size:11.5px;
      color:var(--muted);
      margin-top:10px;
      line-height:1.6;
    }

    /* Tablet */
    @media (max-width:760px){
      .stage{ flex-direction:column; }
      .stage-text{ border-right:none; border-bottom:1px solid var(--line); }
      .stage-image{ min-height:240px; }
      .text-layer{ min-height:260px; }
    }

    /* Phone */
    @media (max-width:600px){
      body{ padding:16px 8px 48px; }
      .toolbar{ padding:8px 10px; gap:6px 10px; }
      .tool-group{ flex:1 1 auto; justify-content:center; }
      .text-btn.danger{ margin-left:0; flex:1 1 100%; text-align:center; }
      input[type="range"]{ width:70px; }
    }

    /* Small phone */
    @media (max-width:400px){
      .tool-btn{ padding:6px 8px; }
      .bar-label{ display:none; }
      .hl-swatch, .pen-swatch{ width:20px; height:20px; min-width:20px; }
      .text-layer{ font-size:15px; }
    }
  </style>
</head>
<body>

  

  <div class="toolbar">
    <div class="tool-group" role="tablist" aria-label="Mode">
      <button class="tool-btn active" data-mode="type">✎ Type</button>
      <button class="tool-btn" data-mode="highlight">▤ Highlight</button>
      <button class="tool-btn" data-mode="move">✥ Move</button>
      <button onclick="window.location.href='../index.html'" class="homeBtn">🏡 Home</button>
    </div>

    <div class="tool-group" aria-label="Draw toggle">
      <button id="drawToggleBtn" class="tool-btn" data-toggle="draw" title="Draw anytime, no need to switch modes">✏ Draw</button>
    </div>

    <div class="tool-group" aria-label="Font size">
      <button id="fontMinus" class="tool-btn font-btn" title="Smaller text">A−</button>
      <button id="fontPlus" class="tool-btn font-btn" title="Larger text">A+</button>
    </div>

    <div class="tool-group" aria-label="Reference image">
      <span class="bar-label">image</span>
      <select id="imageSelect" class="img-select" title="Choose which reference image to display">
        <option value="1.svg">First</option>
        <option value="2.svg">Second</option>
        <option value="sub.svg">Sub</option>
      </select>
    </div>

    <div id="highlightBar" class="sub-bar" style="display:none;">
      <span class="bar-label">color</span>
      <button class="hl-swatch active" data-color="#FFE066" style="background:#FFE066" title="Yellow"></button>
      <button class="hl-swatch" data-color="#B9F6CA" style="background:#B9F6CA" title="Green"></button>
      <button class="hl-swatch" data-color="#FFB3C6" style="background:#FFB3C6" title="Pink"></button>
      <button class="hl-swatch" data-color="#A0E7FF" style="background:#A0E7FF" title="Blue"></button>
      <button class="hl-swatch" data-color="#D9C4FF" style="background:#D9C4FF" title="Purple"></button>
      <button id="clearHighlightBtn" class="text-btn">clear highlights</button>
    </div>

    <div id="drawBar" class="sub-bar" style="display:none;">
      <span class="bar-label">color</span>
      <button class="pen-swatch active" data-color="#2A2622" style="background:#2A2622" title="Ink"></button>
      <button class="pen-swatch" data-color="#C1652F" style="background:#C1652F" title="Amber"></button>
      <button class="pen-swatch" data-color="#2E6E9E" style="background:#2E6E9E" title="Blue"></button>
      <button class="pen-swatch" data-color="#3E8E5A" style="background:#3E8E5A" title="Green"></button>
      <button class="pen-swatch" data-color="#B3243D" style="background:#B3243D" title="Red"></button>
      <button id="eraserBtn" class="text-btn" title="Erase strokes">🧹 Eraser</button>
      <span class="bar-label">size</span>
      <input type="range" id="penSize" min="1" max="90" value="45">
      <button id="undoBtn" class="text-btn">undo stroke</button>
      <button id="clearDrawBtn" class="text-btn">clear drawing</button>
    </div>

    <div id="moveBar" class="sub-bar" style="display:none;">
      <span class="bar-label">drag any letter to move it</span>
      <button id="resetPositionsBtn" class="text-btn">reset layout</button>
    </div>

    <button id="clearTextBtn" class="text-btn danger">clear text</button>
  </div>

  <div id="stage" class="stage">
    <div class="stage-half stage-text">
      <div id="textLayer" class="text-layer" contenteditable="true" data-placeholder="Start typing here…"></div>
      <canvas id="drawCanvas" class="draw-canvas"></canvas>
    </div>
    <div class="stage-half stage-image">
      <!-- Image a.jpg from the "image" folder is displayed here -->
      <img id="previewImage" class="preview-image" src="image/1.svg" alt="Reference image a.jpg">
      <div id="imagePlaceholder" class="image-placeholder" style="display:none;">
        Save an image at <code>./image/1.svg</code> next to this page and refresh — it'll appear here automatically.
      </div>
      <canvas id="drawCanvasImage" class="draw-canvas"></canvas>
    </div>
  </div>

  
<script>
  const textLayer = document.getElementById('textLayer');
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const imageCanvas = document.getElementById('drawCanvasImage');
  const imageCtx = imageCanvas.getContext('2d');
  const stageImage = document.querySelector('.stage-image');

  let mode = 'type'; // 'type' | 'highlight' | 'move'
  let drawEnabled = false; // drawing is an independent overlay, not an exclusive mode
  let highlightColor = '#FFE066';
  let drawColor = '#2A2622';
  let drawSize = 4;
  let isEraser = false;
  let fontSize = 16;
  let isShattered = false;

  // Each drawable surface tracks its own canvas/ctx/strokes independently,
  // but shares the same color/size settings and draw mode.
  function makeSurface(canvasEl, contextEl, sizeFn){
    return {
      canvas: canvasEl,
      ctx: contextEl,
      strokes: [],
      currentStroke: null,
      drawing: false,
      sizeFn
    };
  }

  const textSurface = makeSurface(canvas, ctx, () => ({
    w: Math.max(textLayer.offsetWidth, textLayer.scrollWidth),
    h: Math.max(textLayer.offsetHeight, textLayer.scrollHeight, 320)
  }));
  const imageSurface = makeSurface(imageCanvas, imageCtx, () => ({
    w: stageImage.clientWidth,
    h: stageImage.clientHeight
  }));
  const surfaces = [textSurface, imageSurface];
  let lastUsedSurface = textSurface;

  function sizeSurface(surface){
    const { w, h } = surface.sizeFn();
    const dpr = window.devicePixelRatio || 1;
    surface.canvas.style.width = w + 'px';
    surface.canvas.style.height = h + 'px';
    surface.canvas.width = Math.round(w * dpr);
    surface.canvas.height = Math.round(h * dpr);
    surface.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawStrokes(surface);
  }
  function sizeCanvasToLayer(){
    surfaces.forEach(sizeSurface);
  }

  function redrawStrokes(surface){
    const { ctx: c, strokes, canvas: cv } = surface;
    c.clearRect(0, 0, cv.width, cv.height);
    strokes.forEach(s => {
      if(s.points.length < 1) return;
      c.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
      c.strokeStyle = s.color;
      c.lineWidth = s.size;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(s.points[0].x, s.points[0].y);
      for(let i = 1; i < s.points.length; i++){
        c.lineTo(s.points[i].x, s.points[i].y);
      }
      c.stroke();
    });
    c.globalCompositeOperation = 'source-over';
  }

  function getPos(canvasEl, e){
    const rect = canvasEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(surface, e){
    if(!drawEnabled) return;
    surface.drawing = true;
    lastUsedSurface = surface;
    const p = getPos(surface.canvas, e);
    surface.currentStroke = { color: drawColor, size: isEraser ? drawSize * 2 : drawSize, erase: isEraser, points: [p] };
    surface.strokes.push(surface.currentStroke);
    e.preventDefault();
  }
  function moveDraw(surface, e){
    if(!surface.drawing || !surface.currentStroke) return;
    const p = getPos(surface.canvas, e);
    const pts = surface.currentStroke.points;
    const last = pts[pts.length - 1];
    pts.push(p);
    const c = surface.ctx;
    c.globalCompositeOperation = surface.currentStroke.erase ? 'destination-out' : 'source-over';
    c.strokeStyle = surface.currentStroke.color;
    c.lineWidth = surface.currentStroke.size;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(last.x, last.y);
    c.lineTo(p.x, p.y);
    c.stroke();
    c.globalCompositeOperation = 'source-over';
    e.preventDefault();
  }
  function endDraw(surface){
    surface.drawing = false;
    surface.currentStroke = null;
  }

  surfaces.forEach(surface => {
    const cv = surface.canvas;
    cv.addEventListener('mousedown', e => startDraw(surface, e));
    cv.addEventListener('mousemove', e => moveDraw(surface, e));
    window.addEventListener('mouseup', () => endDraw(surface));
    cv.addEventListener('touchstart', e => startDraw(surface, e), { passive:false });
    cv.addEventListener('touchmove', e => moveDraw(surface, e), { passive:false });
    cv.addEventListener('touchend', () => endDraw(surface));
  });

  function updateCanvasInteractivity(){
    canvas.style.pointerEvents = drawEnabled ? 'auto' : 'none';
    canvas.style.cursor = drawEnabled ? 'crosshair' : 'default';
    imageCanvas.style.pointerEvents = drawEnabled ? 'auto' : 'none';
    imageCanvas.style.cursor = drawEnabled ? 'crosshair' : 'default';
  }

  function setDrawEnabled(next){
    drawEnabled = next;
    document.getElementById('drawToggleBtn').classList.toggle('active', drawEnabled);
    document.getElementById('drawBar').style.display = drawEnabled ? 'flex' : 'none';
    updateCanvasInteractivity();
  }

  document.getElementById('drawToggleBtn').addEventListener('click', () => setDrawEnabled(!drawEnabled));

  function setMode(next){
    mode = next;
    document.querySelectorAll('.tool-btn[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.getElementById('highlightBar').style.display = mode === 'highlight' ? 'flex' : 'none';
    document.getElementById('moveBar').style.display = mode === 'move' ? 'flex' : 'none';
    textLayer.classList.toggle('move-mode', mode === 'move');

    if(mode === 'move'){
      textLayer.setAttribute('contenteditable', 'false');
      shatterText();
    } else {
      textLayer.setAttribute('contenteditable', 'true');
      if(mode === 'type' && !drawEnabled) textLayer.focus();
    }
    updateCanvasInteractivity();
  }

  // ---- Font size ----
  function updateFontSize(delta){
    fontSize = Math.min(100, Math.max(45, fontSize + delta));
    textLayer.style.fontSize = fontSize + 'px';
    sizeCanvasToLayer();
  }
  document.getElementById('fontMinus').addEventListener('click', () => updateFontSize(-2));
  document.getElementById('fontPlus').addEventListener('click', () => updateFontSize(2));

  // ---- Move mode: shatter text into individually draggable letters ----
  function getClientPos(e){
    if(e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function attachDrag(letter){
    let dragOffsetX = 0, dragOffsetY = 0, isDragging = false;

    function onDown(e){
      if(mode !== 'move') return;
      isDragging = true;
      letter.classList.add('dragging');
      const p = getClientPos(e);
      const rect = letter.getBoundingClientRect();
      dragOffsetX = p.x - rect.left;
      dragOffsetY = p.y - rect.top;
      e.preventDefault();
      e.stopPropagation();
    }
    function onMove(e){
      if(!isDragging) return;
      const p = getClientPos(e);
      const stageRect = textLayer.getBoundingClientRect();
      letter.style.left = (p.x - stageRect.left - dragOffsetX) + 'px';
      letter.style.top = (p.y - stageRect.top - dragOffsetY) + 'px';
      e.preventDefault();
    }
    function onUp(){
      isDragging = false;
      letter.classList.remove('dragging');
    }

    letter.addEventListener('mousedown', onDown);
    letter.addEventListener('touchstart', onDown, { passive:false });
    window.addEventListener('mousemove', onMove, { passive:false });
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
  }

  function shatterText(){
    if(isShattered) return;
    const rawText = textLayer.innerText || '';
    textLayer.innerHTML = '';
    if(!rawText.trim()){ isShattered = true; return; }

    // Step 1: lay characters out normally so the browser computes natural wrapping
    const lines = rawText.split('\n');
    const flowSpans = [];
    lines.forEach((line, li) => {
      [...line].forEach(ch => {
        const span = document.createElement('span');
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        textLayer.appendChild(span);
        flowSpans.push(span);
      });
      if(li < lines.length - 1) textLayer.appendChild(document.createElement('br'));
    });

    // Step 2: measure each character's natural position relative to the text layer
    const stageRect = textLayer.getBoundingClientRect();
    const positions = flowSpans.map(span => {
      const r = span.getBoundingClientRect();
      return { left: r.left - stageRect.left, top: r.top - stageRect.top, text: span.textContent };
    });

    // Step 3: rebuild as absolutely-positioned, independently draggable letters
    textLayer.innerHTML = '';
    positions.forEach(pos => {
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = pos.text;
      letter.style.left = pos.left + 'px';
      letter.style.top = pos.top + 'px';
      letter.dataset.origLeft = pos.left;
      letter.dataset.origTop = pos.top;
      textLayer.appendChild(letter);
      attachDrag(letter);
    });
    isShattered = true;
  }

  function resetLetterPositions(){
    textLayer.querySelectorAll('.letter').forEach(letter => {
      letter.style.left = letter.dataset.origLeft + 'px';
      letter.style.top = letter.dataset.origTop + 'px';
    });
  }
  document.getElementById('resetPositionsBtn').addEventListener('click', resetLetterPositions);

  // ---- Right-side image: chosen via the image dropdown, defaults to image/1.svg ----
  const previewImage = document.getElementById('previewImage');
  const imagePlaceholder = document.getElementById('imagePlaceholder');
  const imageSelect = document.getElementById('imageSelect');

  imageSelect.addEventListener('change', function(){
    previewImage.src = 'image/' + this.value;
  });

  previewImage.addEventListener('error', function() {
    this.style.display = 'none';
    imagePlaceholder.style.display = 'block';
  });

  previewImage.addEventListener('load', function() {
    this.style.display = 'block';
    imagePlaceholder.style.display = 'none';
    sizeSurface(imageSurface);
  });

  if (previewImage.complete && previewImage.naturalWidth > 0) {
    previewImage.style.display = 'block';
    imagePlaceholder.style.display = 'none';
  } else if (previewImage.complete && previewImage.naturalWidth === 0) {
    previewImage.style.display = 'none';
    imagePlaceholder.style.display = 'block';
  }

  document.querySelectorAll('.tool-btn[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  document.addEventListener('mouseup', () => {
    if(mode !== 'highlight') return;
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed) return;
    if(!textLayer.contains(sel.anchorNode)) return;
    applyHighlight(highlightColor);
  });

  function applyHighlight(color){
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    try{
      document.execCommand('hiliteColor', false, color);
    }catch(e){
      try{ document.execCommand('backColor', false, color); }catch(e2){}
    }
  }

  document.querySelectorAll('.hl-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      highlightColor = sw.dataset.color;
      document.querySelectorAll('.hl-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    });
  });

  document.querySelectorAll('.pen-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      drawColor = sw.dataset.color;
      isEraser = false;
      document.getElementById('eraserBtn').classList.remove('active');
      document.querySelectorAll('.pen-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    });
  });

  document.getElementById('eraserBtn').addEventListener('click', function(){
    isEraser = !isEraser;
    this.classList.toggle('active', isEraser);
    document.querySelectorAll('.pen-swatch').forEach(s => s.classList.toggle('active', !isEraser && s.dataset.color === drawColor));
  });

  document.getElementById('penSize').addEventListener('input', e => {
    drawSize = Number(e.target.value);
  });

  document.getElementById('clearDrawBtn').addEventListener('click', () => {
    surfaces.forEach(surface => {
      surface.strokes = [];
      surface.ctx.clearRect(0, 0, surface.canvas.width, surface.canvas.height);
    });
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    // Undo the most recent stroke drawn, on whichever surface it was drawn on.
    lastUsedSurface.strokes.pop();
    redrawStrokes(lastUsedSurface);
  });

  document.getElementById('clearHighlightBtn').addEventListener('click', () => {
    const range = document.createRange();
    range.selectNodeContents(textLayer);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    applyHighlight('transparent');
    sel.removeAllRanges();
  });

  document.getElementById('clearTextBtn').addEventListener('click', () => {
    if(confirm('Clear all typed text? This won\'t affect your drawing.')){
      textLayer.innerHTML = '';
      isShattered = false;
      if(mode === 'type') textLayer.focus();
    }
  });

  const ro = new ResizeObserver(() => sizeCanvasToLayer());
  ro.observe(textLayer);
  ro.observe(stageImage);
  window.addEventListener('resize', sizeCanvasToLayer);
  window.addEventListener('orientationchange', () => setTimeout(sizeCanvasToLayer, 200));
  window.addEventListener('load', () => {
    sizeCanvasToLayer();
    setMode('type');
    updateCanvasInteractivity();
  });
</script>
</body>
</html>
